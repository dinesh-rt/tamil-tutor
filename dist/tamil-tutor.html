<script>
/* ===== js/app.js ===== */
/* App shell: boot, hash router, home, category page, search. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data, S = TT.store, UI = TT.ui;

  var views = TT.views = {};
  var current = null;

  /* --------------------------------------------------------------- routing */

  function parseHash() {
    var h = (location.hash || '#/').replace(/^#\/?/, '');
    var segs = h.split('/').filter(Boolean);
    return { name: segs[0] || 'home', a: segs[1] || null, b: segs[2] || null };
  }

  function go(path) {
    if (path.charAt(0) !== '#') path = '#/' + path.replace(/^\/+/, '');
    if (location.hash === path) render(); else location.hash = path;
  }

  function render() {
    var route = parseHash();
    var view = views[route.name] || views.home;
    var host = document.getElementById('view');

    if (current && current.onLeave) { try { current.onLeave(); } catch (e) { /* noop */ } }
    A.cancel();
    U.clear(host);
    host.scrollTop = 0;
    window.scrollTo(0, 0);
    document.body.dataset.view = route.name;

    current = view;
    try {
      view.render(host, route);
    } catch (err) {
      console.error('view failed', err);
      U.append(host, U.el('p.empty', { text: 'Oops — that page had a problem. Tap home to start again.' }));
    }
    document.getElementById('btn-back').hidden = (route.name === 'home');
    updateStars();
    highlightNav(route.name);
  }

  /* The story shelf depends on an async look at the narration pack. If the
     Books tab is already on screen when that answer arrives, paint it again —
     otherwise the child sees ten books or twenty depending on network timing. */
  window.addEventListener('tt:stories-ready', function () {
    var v = document.body.dataset.view;
    /* the shelf needs repainting; a story that failed to open because the pack
       had not landed yet needs it even more. A story that DID open is left
       alone — never yank the page out from under a child mid-read */
    if (v === 'library' || (v === 'book' && document.querySelector('#view > p.empty'))) render();
  });

  function highlightNav(name) {
    U.qsa('.tabbar .tab').forEach(function (t) {
      t.classList.toggle('on', t.dataset.route === name || (name === 'cat' && t.dataset.route === 'learn') || (name === 'book' && t.dataset.route === 'library'));
    });
  }

  /* ---------------------------------------------------------------- chrome */

  function updateStars() {
    var n = S.progress.stickers.length;
    var el = document.getElementById('star-count');
    if (el) el.textContent = n;
  }

  function buildChrome() {
    var body = document.body;

    var bg = U.el('div#bg.bg', { 'aria-hidden': 'true' });
    var shapes = ['🌿', '⭐', '🌸', '🐘', '☁️', '🪁', '🌙', '🍋', '🦋', '🎈'];
    for (var i = 0; i < shapes.length; i++) {
      var s = U.el('span.bg-shape', { text: shapes[i], style: 'left:' + (i * 9.7 + 2) + '%;font-size:' + (26 + (i % 4) * 16) + 'px;animation-duration:' + (26 + (i % 5) * 9) + 's;animation-delay:-' + (i * 3.3) + 's;opacity:' + (0.10 + (i % 3) * 0.05) });
      bg.appendChild(s);
    }
    U.append(body, bg);

    var backBtn = U.el('button#btn-back.icon-btn.nav-back', { type: 'button', 'aria-label': 'Back', hidden: true, text: '←' });
    backBtn.addEventListener('click', function () { A.sfx('tap'); history.length > 1 ? history.back() : go('home'); });

    var brand = U.el('button.brand', { type: 'button', 'aria-label': 'Tamil Tutor home' }, [
      U.el('span.brand-ico', { text: '🐘' }),
      U.el('span.brand-text', {}, [
        U.el('span.brand-ta.tamil', { text: 'தமிழ்' }),
        U.el('span.brand-en', { text: 'Tutor' })
      ])
    ]);
    brand.addEventListener('click', function () { A.unlock(); A.sfx('ding'); go('home'); });
    /* hidden grown-up entrance: press and hold the elephant for 3 seconds */
    var holdTimer = null, holdRing = null;
    function startHold() {
      if (!S.settings.kidLock) return;
      holdRing = U.el('span.hold-ring');
      brand.appendChild(holdRing);
      holdTimer = setTimeout(function () {
        if (holdRing) { holdRing.remove(); holdRing = null; }
        A.sfx('correct'); go('grownup');
      }, 3000);
    }
    function endHold() { clearTimeout(holdTimer); if (holdRing) { holdRing.remove(); holdRing = null; } }
    brand.addEventListener('pointerdown', startHold);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) { brand.addEventListener(t, endHold); });

    var starBtn = U.el('button.icon-btn.star-btn', { type: 'button', 'aria-label': 'My stars' }, [
      U.el('span', { text: '⭐' }), U.el('span#star-count.badge', { text: '0' })
    ]);
    starBtn.addEventListener('click', function () { A.sfx('tap'); go('stickers'); });

    var soundBtn = U.el('button.icon-btn.sound-btn', { type: 'button', 'aria-label': 'Sound on/off' });
    function paintSound() {
      soundBtn.textContent = (S.settings.muted || S.settings.sfx === false) ? '🔇' : '🔊';
      soundBtn.setAttribute('aria-pressed', String(!(S.settings.muted || S.settings.sfx === false)));
    }
    soundBtn.addEventListener('click', function () {
      S.settings.muted = !S.settings.muted;
      S.save(); paintSound();
      if (!S.settings.muted) { A.unlock(); A.sfx('ding'); } else A.cancel();
    });
    paintSound();
    TT.repaintSound = paintSound;

    var parentBtn = U.el('button.icon-btn.parent-btn', { type: 'button', 'aria-label': 'Grown-ups' }, [U.el('span', { text: '🧩' })]);
    parentBtn.addEventListener('click', function () { A.sfx('tap'); go('grownup'); });
    function paintKidLock() { parentBtn.hidden = !!S.settings.kidLock; }
    paintKidLock();
    TT.repaintKidLock = paintKidLock;

    U.append(body, [
      U.el('header.topbar', {}, [
        backBtn, brand,
        U.el('div.topbar-actions', {}, [starBtn, soundBtn, parentBtn])
      ])
    ]);

    var tabs = [
      { route: 'home', icon: '🏠', ta: 'முகப்பு', en: 'Home' },
      { route: 'learn', icon: '📚', ta: 'கற்க', en: 'Learn' },
      /* the Tamil for this tab is the word bank's own word for "book" */
      { route: 'library', icon: '📖', ta: (D.getWord('school/book') || {}).ta || 'Books', en: 'Books' },
      { route: 'play', icon: '🎲', ta: 'விளையாடு', en: 'Play' },
      { route: 'stickers', icon: '⭐', ta: 'நட்சத்திரம்', en: 'Stars' }
    ];
    var tabbar = U.el('nav.tabbar', { role: 'navigation', 'aria-label': 'Main' });
    tabs.forEach(function (t) {
      var b = U.el('button.tab', { type: 'button', dataset: { route: t.route }, 'aria-label': t.en }, [
        U.el('span.tab-ico', { text: t.icon }),
        U.el('span.tab-ta.tamil', { text: t.ta }),
        U.el('span.tab-en', { text: t.en })
      ]);
      b.addEventListener('click', function () { A.unlock(); A.sfx('tap'); go(t.route); });
      tabbar.appendChild(b);
    });
    U.append(body, tabbar);
    U.append(body, U.el('div#sheet-root'));
    U.append(body, U.el('canvas#fx.fx-canvas', { 'aria-hidden': 'true' }));
  }

  /* ------------------------------------------------------------------ home */

  views.home = {
    render: function (host, route) {
      var cats = D.allCategories();
      var st = S.stats();

      var hello = U.el('section.hero', {}, [
        U.el('div.hero-mascot', { 'aria-hidden': 'true' }, [U.el('span.hero-elephant', { text: '🐘' })]),
        U.el('div.hero-text', {}, [
          U.el('h1.hero-ta.tamil', { text: 'வணக்கம்!' }),
          U.el('p.hero-en', {}, ['Hello little one — ', U.el('b', { text: 'let’s learn Tamil!' })]),
          U.el('p.hero-stats', {}, [
            U.el('span.stat-pill', { text: '⭐ ' + st.stickers }),
            U.el('span.stat-pill', { text: '👀 ' + st.seen + '/' + st.total }),
            U.el('span.stat-pill', { text: '🔒 ' + st.mastered + ' mastered' })
          ])
        ])
      ]);
      hello.querySelector('.hero-mascot').addEventListener('click', function () {
        A.unlock(); A.cancel(); A.sfx('applause'); A.speakText('வணக்கம்! நாம் தமிழ் படிப்போமா. வாங்க!', { lang: 'ta', roman: 'Vanakkam! Naam Tamil padippoma. Vaanga!' });
        TT.confetti.atEl(hello, { count: 26 });
      });
      host.appendChild(hello);

      /* keep going */
      var last = S.settings.lastCategory && D.getCat(S.settings.lastCategory) ? D.getCat(S.settings.lastCategory) : null;
      if (last) {
        host.appendChild(U.el('section.row', {}, [
          UI.sectionHead('தொடரலாம்', 'Pick up where you left off'),
          U.el('div.row-cta', {}, [
            UI.bigButton('Continue ' + last.en, { icon: last.icon, ta: last.ta, color: last.color, sub: last.words.length + ' words' }, function () { go('cards/' + last.key); }),
            UI.bigButton('Play a game', { icon: '🎲', ta: 'விளையாடு', color: '#7c3aed' }, function () { go('play/' + last.key); })
          ])
        ]));
      }

      /* five brand new words to meet today */
      var fresh = [];
      var pool = D.allWords();
      var shuffled = D.shuffle(pool);
      for (var i = 0; i < shuffled.length && fresh.length < 5; i++) {
        if (S.level(shuffled[i].id) === 0 && (!last || shuffled[i].cat === last.key || fresh.length > 2)) fresh.push(shuffled[i]);
      }
      if (!fresh.length) fresh = D.shuffle(pool).slice(0, 5);
      host.appendChild(U.el('section.row', {}, [
        UI.sectionHead('இன்னைக்கு புதிய சொல்', 'New words for today'),
        U.el('div.mini-row', {}, fresh.map(function (w) { return UI.miniCard(w); }))
      ]));

      /* today's review — what the boxes say is due, tap the band to play it */
      var today = S.todayWords ? S.todayWords(6) : S.reviewQueue(null, 5);
      if (today.length > 1) {
        var dueN = S.dueCount ? S.dueCount() : today.length;
        var playToday = U.el('button.btn.btn-small', { type: 'button', text: '▶ Play' });
        playToday.addEventListener('click', function () { A.unlock(); A.sfx('tap'); go('play/today'); });
        host.appendChild(U.el('section.row.today-band', {}, [
          UI.sectionHead('மீண்டு பாப்போம்', 'Today — ' + dueN + ' word' + (dueN === 1 ? '' : 's') + ' waiting', playToday),
          U.el('div.mini-row', {}, today.map(function (w) { return UI.miniCard(w); }))
        ]));
      }

      /* all the categories */
      host.appendChild(U.el('section.row', {}, [
        UI.sectionHead('என்ன படிப்போம்?', 'Choose a topic', (function () {
          var b = U.el('button.chip', { type: 'button' }, [U.el('span.chip-ico', { text: '🔎' }), U.el('span', { text: 'Search' })]);
          b.addEventListener('click', function () { go('search'); });
          return b;
        })()),
        U.el('div.tile-grid', {}, cats.map(function (c) { return UI.catTile(c, '#/cat/' + c.key); }))
      ]));

      var foot = U.el('p.foot-note', {}, [
        'Made for little hands · works offline · no ads, no tracking. ',
        U.el('button.linkish', { type: 'button', text: 'Grown-up corner' })
      ]);
      foot.querySelector('.linkish').addEventListener('click', function () { go('grownup'); });
      host.appendChild(foot);
    }
  };

  /* --------------------------------------------------------- learn (picker) */

  views.learn = {
    render: function (host) {
      host.appendChild(UI.sectionHead('படிக்கலாம்', 'Choose a topic to start flashcards'));
      var wrap = U.el('div.tile-grid', {});
      D.allCategories().forEach(function (c) { wrap.appendChild(UI.catTile(c, '#/cat/' + c.key)); });
      host.appendChild(wrap);
    }
  };

  views.play = {
    render: function (host, route) {
      host.appendChild(UI.sectionHead('விளையாடு', 'Games — pick a topic'));
      var cats = D.allCategories();
      var wrap = U.el('div.tile-grid', {});
      cats.forEach(function (c) {
        var a = UI.catTile(c, '#/play/' + c.key);
        a.classList.add('tile-game');
        wrap.appendChild(a);
      });
      host.appendChild(wrap);
    }
  };

  /* ------------------------------------------------------- category landing */

  views.cat = {
    render: function (host, route) {
      var cat = D.getCat(route.a);
      if (!cat) { go('learn'); return; }
      S.settings.lastCategory = cat.key; S.save();

      var head = U.el('section.cat-head', { style: '--cat:' + cat.color }, [
        U.el('div.cat-icon', { text: cat.icon }),
        U.el('div.cat-title', {}, [
          U.el('h1.tamil', { text: cat.ta }),
          U.el('p.cat-en', { text: cat.en }),
          U.el('p.cat-desc', { text: cat.desc })
        ])
      ]);
      head.querySelector('.cat-icon').addEventListener('click', function () {
        A.unlock(); A.cancel(); A.speakText(cat.ta, { lang: 'ta' }); A.sfx('ding');
        TT.confetti.atEl(head, { count: 18 });
      });
      host.appendChild(head);

      var seen = cat.words.filter(function (w) { return S.level(w.id) > 0; }).length;
      host.appendChild(U.el('div.cat-cta', {}, [
        UI.bigButton('Flashcards', { icon: '🃏', ta: 'சொல் அட்டை', color: cat.color, sub: cat.words.length + ' words' }, function () { go('cards/' + cat.key); }),
        UI.bigButton('Games', { icon: '🎲', ta: 'விளையாட்டு', color: cat.color, sub: '3 games' }, function () { go('play/' + cat.key); }),
        UI.bigButton('Say them all', { icon: '🗣️', ta: 'பட்டியல்', color: cat.color, sub: seen + ' met' }, function () { go('wall/' + cat.key); })
      ]));

      host.appendChild(UI.sectionHead('அனைத்து சொற்கள்', 'All the words — tap to hear them'));
      var wall = U.el('div.mini-grid', {});
      cat.words.forEach(function (w) { wall.appendChild(UI.miniCard(w)); });
      host.appendChild(wall);
    }
  };

  views.wall = {
    render: function (host, route) {
      var cat = D.getCat(route.a);
      if (!cat) { go('learn'); return; }
      host.appendChild(UI.sectionHead(cat.ta, cat.en + ' — tap any picture to hear it'));
      var wall = U.el('div.mini-grid', {});
      cat.words.forEach(function (w) { wall.appendChild(UI.miniCard(w)); });
      host.appendChild(wall);
    }
  };

  /* ---------------------------------------------------------------- search */

  views.search = {
    render: function (host) {
      host.appendChild(UI.sectionHead('தேடு', 'Search in Tamil, English or how it sounds'));
      var input = U.el('input.search-input', { type: 'search', placeholder: 'dog, நாய், naai…', 'aria-label': 'Search words', autocomplete: 'off' });
      var out = U.el('div.mini-grid', {});
      host.appendChild(input); host.appendChild(out);
      setTimeout(function () { input.focus(); }, 60);

      function run() {
        var q = input.value.trim();
        var res = q ? D.search(q).slice(0, 60) : D.shuffle(D.allWords()).slice(0, 24);
        U.clear(out);
        if (!res.length) { U.append(out, UI.empty('No words found — try another spelling')); return; }
        res.forEach(function (w) { out.appendChild(UI.miniCard(w)); });
      }
      input.addEventListener('input', U.debounce(run, 160));
      run();
    }
  };

  /* ------------------------------------------------------------------ boot */

  function applyTheme() {
    document.documentElement.dataset.theme = S.settings.theme || 'day';
    document.documentElement.dataset.motion = S.settings.reduceMotion ? 'reduced' : 'full';
  }

  function registerCustomWords() {
    if (!S.custom.length) return;
    if (!D.getCat('custom')) {
      D.category({ key: 'custom', en: 'My words', ta: 'நம்ம சொற்கள்', icon: '🏡', color: '#0f766e', desc: 'Added by you' });
    }
    S.custom.forEach(function (w) {
      var key = w.cat && D.getCat(w.cat) ? w.cat : 'custom';
      D.words(key, [{ en: w.en, ta: w.ta, ro: w.ro, img: w.img, mo: w.mo, say: w.say }]);
    });
  }

  /* ------------------------------------------------ new version / save health */

  var updateBar = null;
  var reloading = false;

  function offerUpdate(worker) {                 // a refreshed worker is installed, waiting
    if (!worker || updateBar || reloading) return;
    var later, go;
    updateBar = U.el('div.update-bar', { role: 'status', 'aria-live': 'polite' }, [
      U.el('span.update-bar-text', { text: '🆕 New version ready' }),
      go = U.el('button.btn.btn-small', { text: 'Refresh', onclick: function () {
        try { worker.postMessage({ type: 'SKIP_WAITING' }); }
        catch (e) { location.reload(); }
      } }),
      later = U.el('button.btn.btn-ghost.btn-small', { text: 'Later', onclick: function () {
        if (updateBar) { updateBar.remove(); updateBar = null; }
      } })
    ]);
    document.body.appendChild(updateBar);
    return updateBar;
  }

  function watchForUpdates(reg) {
    if (reg.waiting) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function () {
        var st = nw.state || nw.status;
        if (st === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
      });
    });
    var ping = function () { try { reg.update(); } catch (e) { } };
    ping();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) ping(); });
  }

  function storageNotice() {
    var st = S.storageStatus ? S.storageStatus() : { persist: true };
    if (!st.persist) {
      if (A && A.sfx) { /* nothing to play yet — first gesture hasn't happened */ }
      setTimeout(function () {
        if (TT.ui && TT.ui.toast) TT.ui.toast('⚠️ Progress cannot be saved here — use Data → Export', { ms: 4200 });
      }, 900);
    } else if (st.recovered || st.lostOnLoad) {
      setTimeout(function () {
        if (TT.ui && TT.ui.toast) TT.ui.toast(st.recovered ? '↩️ Recovered your last good save' : 'ℹ️ Starting fresh (old save was unreadable)', { ms: 3200 });
      }, 900);
    }
    return st;
  }

  function boot() {
    S.load();
    registerCustomWords();
    applyTheme();
    if (A && A.loadPack) A.loadPack();      // human recordings, if they were generated
    buildChrome();
    if (TT.repaintKidLock) TT.repaintKidLock();

    /* one gesture unlocks speech + audio for the whole session (iOS rule) */
    function unlockOnce() {
      A.unlock();
      window.removeEventListener('pointerdown', unlockOnce);
      window.removeEventListener('keydown', unlockOnce);
    }
    window.addEventListener('pointerdown', unlockOnce);
    window.addEventListener('keydown', unlockOnce);

    S.startSession();
    storageNotice();
    var start = Date.now();
    setInterval(function () {
      var mins = Math.round((Date.now() - start) / 60000);
      if (mins > 0) { S.addMinutes(mins); start = Date.now(); }
    }, 60000);

    window.addEventListener('hashchange', render);
    render();

    /* offline / home-screen support — only when served over http(s) */
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js')
        .then(watchForUpdates)
        .catch(function () { /* offline-first is a bonus */ });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return;
        reloading = true;
        if (updateBar) { updateBar.remove(); updateBar = null; }
        location.reload();
      });
    }
  }

  TT.version = '1.0.0';

  TT.app = {
    go: go, render: render, views: views, applyTheme: applyTheme, boot: boot,
    registerCustomWords: registerCustomWords, offerUpdate: offerUpdate,
    storageNotice: storageNotice,
    checkForUpdate: function (cb) {
      if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) { if (cb) cb(false); return; }
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) { if (cb) cb(false); return; }
        watchForUpdates(reg);
        if (cb) cb(!!reg.waiting || !!reg.installing);
      }, function () { if (cb) cb(false); });
    }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/views/learn.js ===== */
/* Flashcards: one big card at a time, swipe or tap the arrows, spoken aloud. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data, S = TT.store, UI = TT.ui;

  var praiseTa = ['சூப்பர்!', 'ரொம்ப நல்லா!', 'மெல்ல மெல்ல!', 'அருமை!', 'நல்லா படிக்கிற'];

  TT.views.cards = {
    render: function (host, route) {

      if (!deck.length) { U.append(host, UI.empty('No words here yet')); return; }

      S.settings.lastCategory = cat ? cat.key : null; S.save();
      var color = cat ? cat.color : '#7c3aed';
      var i = 0, starsThisRun = 0, autoplayTimer = null, done = false;

      var bar = U.el('div.deck-bar', {}, [
        U.el('button.icon-btn', { type: 'button', 'aria-label': 'Back to topic', text: '☰' }),
        U.el('div.deck-meta', {}, [
          U.el('span.deck-cat', { text: cat ? cat.ta : 'அனைத்தும்' }),
          U.el('span.deck-count', { text: '1 / ' + deck.length })
        ]),
        U.el('div.deck-progress', {}, U.el('div.deck-progress-fill', { style: 'width:0%;background:' + color })),

      ]);
      bar.children[0].addEventListener('click', function () { A.sfx('tap'); go(cat ? 'cat/' + cat.key : 'learn'); });
      bar.querySelector('.deck-again').addEventListener('click', function () {
        A.cancel(); stopAutoplay(); A.sayWord(deck[i]); A.sfx('pop');
      });

      var stage = U.el('div.deck-stage', { style: '--cat:' + color });
      var ring = U.el('div.autoplay-ring', { 'aria-hidden': 'true' });

      var nav = U.el('div.deck-nav', {}, [
        U.el('button.nav-arrow.prev', { type: 'button', 'aria-label': 'Previous word' }, [U.el('span', { text: '◀' })]),
        U.el('button.nav-hint', { type: 'button', 'aria-label': 'Tap the card to hear the word' }, [U.el('span', { text: '👆' }), U.el('small', { text: 'tap the picture' })]),
        U.el('button.nav-arrow.next', { type: 'button', 'aria-label': 'Next word' }, [U.el('span', { text: '▶' })])
      ]);
      nav.querySelector('.prev').addEventListener('click', function () { step(-1); });
      nav.querySelector('.next').addEventListener('click', function () { step(1); });
      nav.querySelector('.nav-hint').addEventListener('click', function () { A.cancel(); A.sayWord(deck[i]); });

      U.append(host, [bar, stage, nav]);

      function paint() {
        var w = deck[i];
        U.clear(stage);
        stage.appendChild(ring);
        var card = UI.cardEl(w, {
          size: 'big',
          onEnd: function () { if (S.settings.autoplay) startAutoplay(); },
          onTap: function () { stopAutoplay(); }
        });
        stage.appendChild(card);
        bar.querySelector('.deck-count').textContent = (i + 1) + ' / ' + deck.length;
        bar.querySelector('.deck-progress-fill').style.width = Math.round(((i + 1) / deck.length) * 100) + '%';
        S.markSeen(w.id);
        A.cancel();
        /* speak automatically — a toddler taps what they can see, hearing is the reward */
        setTimeout(function () {
          A.sayWord(w, { onend: function () { if (S.settings.autoplay) startAutoplay(); } });
        }, 180);
      }

      function step(dir) {
        if (done) return;
        stopAutoplay();
        A.cancel();
        var n = i + dir;
        if (n < 0) { n = 0; U.haptic(30); return; }
        if (n >= deck.length) { finish(); return; }
        i = n;
        animateOut(dir);
      }

      function animateOut(dir) {
        var card = stage.querySelector('.card');
        if (!card || S.settings.reduceMotion) { paint(); return; }
        card.classList.add(dir > 0 ? 'fly-left' : 'fly-right');
        A.sfx('whoosh');
        setTimeout(paint, 190);
      }

      function finish() {
        done = true;
        stopAutoplay();
        U.clear(stage); U.clear(nav);
        var panel = U.el('div.deck-done', {}, [
          U.el('div.done-emoji', { text: '🎉' }),
          U.el('h2.tamil', { text: 'மெல்ல மெல்ல!' }),
          U.el('p', { text: 'You finished all ' + deck.length + ' words' + (starsThisRun ? ' and won ' + starsThisRun + ' ⭐' : '') }),
          U.el('div.done-actions', {}, [
            UI.bigButton('Play again', { icon: '🔁', color: color }, function () { done = false; i = 0; U.append(host, navBarClone()); renderNav(); paint(); }),
            UI.bigButton('Games', { icon: '🎲', color: '#7c3aed' }, function () { go('play/' + (cat ? cat.key : 'all')); }),
            UI.bigButton('Topics', { icon: '📚', color: '#0ea5e9' }, function () { go('learn'); })
          ])
        ]);
        stage.appendChild(panel);
        U.clear(nav);
        A.sfx('applause');
        A.speakText('அருமை! ரொம்ப நல்லா படிக்கிற.', { lang: 'ta', roman: 'Arumai! Romba nalla padikkira.' });
        TT.confetti.rain({ count: 70 });
      }

      function renderNav() {
        U.clear(nav);
        var p = U.el('button.nav-arrow.prev', { type: 'button', 'aria-label': 'Previous word' }, [U.el('span', { text: '◀' })]);
        var h = U.el('button.nav-hint', { type: 'button' }, [U.el('span', { text: '👆' }), U.el('small', { text: 'tap the picture' })]);
        var nx = U.el('button.nav-arrow.next', { type: 'button', 'aria-label': 'Next word' }, [U.el('span', { text: '▶' })]);
        p.addEventListener('click', function () { step(-1); });
        nx.addEventListener('click', function () { step(1); });
        h.addEventListener('click', function () { A.cancel(); A.sayWord(deck[i]); });
        U.append(nav, [p, h, nx]);
      }
      function navBarClone() { return null; }

      /* ---- star every 5 cards ---- */
      var seenInRun = 0;
      var origPaint = paint;
      paint = function () {
        origPaint();
        seenInRun++;
        if (S.settings.rewardStars !== false && seenInRun % 5 === 0) {
          starsThisRun++;
          S.addSticker(deck[i].id, deck[i].cat);
          TT.confetti.burst(window.innerWidth / 2, window.innerHeight * 0.42, { count: 30 });
          A.sfx('sparkle');
          UI.toast('⭐ Star for you!');
          TT.app.repaintSound && 0;
          var badge = document.getElementById('star-count'); if (badge) badge.textContent = S.progress.stickers.length;
        }
      };

      /* ---- swipe ----
         NB: we only take pointer capture once the finger has actually moved.
         Capturing on pointerdown would retarget the click to the stage and the
         card would never hear the tap — no word, no sound, no flip. */
      var drag = { active: false, moved: false, x0: 0, y0: 0, dx: 0, node: null, id: null };
      stage.addEventListener('pointerdown', function (e) {
        if (done) return;
        if (e.isPrimary === false || (e.button != null && e.button !== 0)) return;
        var card = stage.querySelector('.card');
        if (!card) return;
        drag.active = true; drag.moved = false; drag.x0 = e.clientX; drag.y0 = e.clientY;
        drag.dx = 0; drag.node = card; drag.id = e.pointerId;
      });
      stage.addEventListener('pointermove', function (e) {
        if (!drag.active || !drag.node) return;
        drag.dx = e.clientX - drag.x0;
        if (!drag.moved) {
          if (Math.abs(drag.dx) < 8 && Math.abs(e.clientY - drag.y0) < 8) return;
          if (Math.abs(drag.dx) < 8) return;              /* vertical scroll wins */
          drag.moved = true;
          try { stage.setPointerCapture(drag.id); } catch (err) { /* ignore */ }
        }
        drag.node.style.transform = 'translateX(' + drag.dx * 0.85 + 'px) rotate(' + (drag.dx / 30) + 'deg)';
        drag.node.style.transition = 'none';
      });
      function endDrag(e) {
        if (!drag.active) return;
        drag.active = false;
        var card = drag.node, moved = drag.moved, dx = drag.dx;
        drag.node = null; drag.moved = false; drag.dx = 0;
        if (!card) return;
        try { if (moved && stage.hasPointerCapture && stage.hasPointerCapture(drag.id)) stage.releasePointerCapture(drag.id); } catch (err) { /* ignore */ }
        card.style.transition = '';
        if (moved && Math.abs(dx) > 70) { card.style.transform = ''; step(dx < 0 ? 1 : -1); }
        else if (moved) card.style.transform = '';
      }
      stage.addEventListener('pointerup', endDrag);
      stage.addEventListener('pointercancel', endDrag);
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      /* ---- keyboard ---- */
      function onKey(e) {
        if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
        else if (e.key === ' ' || e.key === 'Enter') { A.cancel(); A.sayWord(deck[i]); e.preventDefault(); }
      }
      window.addEventListener('keydown', onKey);

      /* ---- autoplay ---- */
      function startAutoplay() {
        stopAutoplay();
        if (!S.settings.autoplay || done) return;
        var secs = U.clamp(S.settings.autoplaySec || 9, 3, 40);
        ring.classList.add('on');
        ring.style.animation = 'none'; void ring.offsetWidth;
        ring.style.animation = 'ring ' + secs + 's linear forwards';
        autoplayTimer = setTimeout(function () { step(1); }, secs * 1000);
      }
      function stopAutoplay() {
        clearTimeout(autoplayTimer); autoplayTimer = null;
        ring.classList.remove('on');
      }

      this.onLeave = function () {
        window.removeEventListener('keydown', onKey);
        window.removeEventListener('pointerup', endDrag);
        window.removeEventListener('pointercancel', endDrag);
        stopAutoplay();
        A.cancel();
      };

      paint();
    }
  };

  function go(p) { TT.app.go(p); }
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/views/library.js ===== */
/* Books: the shelf, and the reader that plays a book page by page.

   Everything a child hears here is a recording the app already owns, and every
   Tamil label is a string lifted from the word bank — this file adds English
   chrome only, so nothing unvetted reaches a two-year-old's ears. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data, S = TT.store, UI = TT.ui;
  var views = TT.views, B = TT.books;

  function go(p) { TT.app.go(p); }
  function bookWord() { var w = D.getWord('school/book'); return (w && w.ta) || 'Books'; }

  /* ------------------------------------------------------------------ shelf */

  views.library = {
    render: function (host) {
      var all = B.all();
      A.unlock();

      U.append(host, UI.sectionHead(bookWord(), 'Books — tap the page to hear it'));

      /* the one you abandoned halfway, if any */
      var started = null;
      all.forEach(function (b) {
        var st = S.bookState(b.id);
        if (st.page > 0 && !st.finished && (!started || st.page > S.bookState(started.id).page)) started = b;
      });
      if (started) {
        var st0 = S.bookState(started.id);
        host.appendChild(U.el('section.row', {}, [
          UI.sectionHead('தொடரலாம்', 'Continue the book you were on'),
          U.el('div.row-cta', {}, [
            UI.bigButton(started.en, {
              icon: started.icon, ta: started.ta, color: started.color,
              sub: 'page ' + Math.min(st0.page + 1, B.pagesOf(started).length) + ' of ' + B.pagesOf(started).length
            }, function () { A.sfx('tap'); go('book/' + started.id + '/' + st0.page); })
          ])
        ]));
      }

      function row(list, ta, en) {
        if (!list.length) return;
        host.appendChild(UI.sectionHead(ta, en));
        var shelf = U.el('div.shelf', { role: 'list' });
        list.forEach(function (b) { shelf.appendChild(tile(b)); });
        host.appendChild(shelf);
      }

      var board = all.filter(function (b) { return !b.story; });
      var tales = all.filter(function (b) { return b.story; });
      if (tales.length && board.length) {
        row(board, 'புத்தகங்கள்', 'Tap a page to hear it');
        row(tales, 'கதைகள்', 'Ten old tales — one line per page, read aloud');
      } else {
        row(all, bookWord(), 'Tap a page to hear it');
      }

      /* narration pending is a build state, not a child's problem — but a
         grown-up scanning the shelf should be able to see it */
      var waiting = B.storiesWaiting();
      if (waiting) {
        U.append(host, U.el('p.empty', {
          text: waiting + (waiting === 1 ? ' story is' : ' stories are')
              + ' written but have no narration yet — run tools/make-story-pack.py to hear them.'
        }));
      }
    }
  };

  function tile(b) {
    var st = S.bookState(b.id), n = B.pagesOf(b).length;
    var meta;
    if (st.reads && st.finished) meta = '⭐ read ' + st.reads + '×';
    else if (st.page > 0) meta = '▶ page ' + Math.min(st.page + 1, n) + '/' + n;
    else meta = n + ' pages';

    var ico = U.el('span.book-ico', { text: b.icon, 'aria-hidden': 'true' });
    /* Art is a promise the build has to keep, but a missing webp must never
       take the tile with it: the emoji was the cover first, and stays the
       fallback if a phone is offline on a day the pictures never arrived. */
    var art = null;
    if (b.art) {
      art = U.el('img.book-art', { src: b.art, alt: b.en, loading: 'lazy' });
      art.addEventListener('error', function () { art.setAttribute('data-missing', '1'); });
      art.addEventListener('load', function () { t.classList.add('has-art'); });
    }

    var t = U.el('button.book-tile', {
      type: 'button', role: 'listitem', 'aria-label': b.en + ' — ' + b.ta,
      dataset: { id: b.id, story: b.story ? '1' : '0' }
    }, [
      art,
      ico,
      U.el('span.book-ta.tamil', { text: b.ta }),
      U.el('span.book-en', { text: b.en }),
      U.el('span.book-meta', { text: meta, dataset: { done: st.finished ? '1' : '0' } })
    ]);
    t.style.setProperty('--tint', b.color);
    t.addEventListener('click', function () { A.unlock(); A.sfx('tap'); go('book/' + b.id); });
    return t;
  }

  /* ---------------------------------------------------------------- reader */

  views.book = {
    render: function (host, route) {
      var b = B.get(route.a);
      if (!b) {
        U.append(host, U.el('p.empty', { text: 'No such book yet — tap Books to see the shelf.' }));
        return;
      }
      var pages = B.pagesOf(b);
      var total = pages.length;
      var idx = clampPage(parseInt(route.b, 10));
      var revealed = false, quizPicks = {}, endAwarded = false;
      var auto = false;

      function clampPage(i) {
        if (isNaN(i) || i < 0) i = 0;
        return Math.min(i, total - 1);
      }
      /* the URL stays at #/book/<id> while paging: a toddler swiping back
         should land on the shelf, not replay page 3 of a half-read book */

      /* ---- chrome */
      var dots = U.el('div.page-dots');
      for (var i = 0; i < total; i++) dots.appendChild(U.el('i.dot', { dataset: { i: String(i) } }));

      var autoBtn = U.el('button.icon-btn.reader-auto', { type: 'button', text: '▶▶', 'aria-label': 'Auto-play the pages', 'aria-pressed': 'false' });
      autoBtn.addEventListener('click', function () {
        auto = !auto;
        autoBtn.classList.toggle('on', auto);
        autoBtn.setAttribute('aria-pressed', String(auto));
        A.sfx('tap');
        if (auto) sayCurrent();
      });

      var title = U.el('div.reader-title', {}, [
        U.el('span.reader-ico', { text: b.icon, 'aria-hidden': 'true' }),
        U.el('span.reader-ta.tamil', { text: b.ta }),
        U.el('span.reader-en', { text: b.en })
      ]);

      var back = U.el('button.icon-btn', { type: 'button', text: '📚', 'aria-label': 'Back to the shelf' });
      back.addEventListener('click', function () { A.sfx('tap'); A.cancel(); go('library'); });

      host.appendChild(U.el('div.reader-top', {}, [back, title, autoBtn]));
      host.appendChild(dots);

      var stage = U.el('div.book-stage', { role: 'group', 'aria-label': b.en });
      host.appendChild(stage);

      var prev = U.el('button.btn.btn-round', { type: 'button', text: '◀', 'aria-label': 'Previous page' });
      var replay = U.el('button.btn.btn-round', { type: 'button', text: '🔉', 'aria-label': 'Say it again' });
      var next = U.el('button.btn.btn-round.next', { type: 'button', text: '▶', 'aria-label': 'Next page' });
      prev.addEventListener('click', function () { turn(-1); });
      next.addEventListener('click', function () { turn(1); });
      replay.addEventListener('click', function () { A.sfx('tap'); sayCurrent(); });
      host.appendChild(U.el('div.reader-nav', {}, [prev, replay, next]));

      function turn(d) {
        var to = idx + d;
        if (to < 0) { A.sfx('tap'); return; }
        if (to >= total) { A.sfx('tap'); return; }
        A.sfx('flip');
        idx = to; revealed = false;
        paint();
      }

      /* one place decides what a page sounds like, so ▶▶ and 🔉 agree */
      function sayCurrent() {
        var p = pages[idx];
        if (!p) return;
        if (p.k === 'word') { var w = B.word(p.w); if (w) speak(w, p.hide && !revealed); }
        else if (p.k === 'count') speakCount(p);
        else if (p.k === 'quiz') speakQuiz(p);
        else if (p.k === 'line') speakLine(p);
        else if (p.k === 'moral') speakLine(p);
        else if (p.k === 'cover') { A.sfx('ding'); }
      }

      function speak(w, silent) {
        if (silent) return;
        S.markSeen(w.id);
        A.sayWord(w, { onend: function () { if (auto) later(); } });
      }

      function later() { setTimeout(function () { if (auto && idx < total - 1) turn(1); }, 700); }

      function speakCount(p) {
        var num = B.word(p.num), item = B.word(p.item);
        if (!num || !item) return;
        S.markSeen(num.id);
        A.sayWord(num, { onend: function () { setTimeout(function () { A.sayWord(item, { onend: function () { if (auto) later(); } }); }, 200); } });
      }

      function speakQuiz(p) {
        var t = B.word(p.w);
        if (!t) return;
        A.sayWord(t, { onend: function () { if (auto) later(); } });
      }

      function speakLine(p) {
        A.playClip(p.clip, { dur: p.dur, onend: function () { if (auto) later(); } });
      }

      /* ---- pages */
      function paint() {
        A.cancel();
        U.clear(stage);
        var p = pages[idx];
        U.qsa('.page-dots .dot', host).forEach(function (d, i) { d.classList.toggle('on', i === idx); });
        prev.disabled = (idx === 0);
        next.disabled = (idx >= total - 1);
        S.markBookPage(b.id, idx);

        if (p.k === 'cover') return pageCover(p);
        if (p.k === 'end') return pageEnd(p);
        if (p.k === 'word') return pageWord(p);
        if (p.k === 'count') return pageCount(p);
        if (p.k === 'quiz') return pageQuiz(p);
        if (p.k === 'line') return pageLine(p);
        if (p.k === 'moral') return pageMoral(p);
        pageWord(p);
      }

      function pageCover() {
        var art = b.art ? U.el('img.cover-art', { src: b.art, alt: b.en }) : null;
        if (art) art.addEventListener('error', function () { art.parentNode.removeChild(art); });
        var c = U.el('div.book-cover', {}, [
          art,
          U.el('div.cover-ico', { text: b.icon, 'aria-hidden': 'true' }),
          U.el('div.cover-ta.tamil', { text: b.ta }),
          U.el('div.cover-en', { text: b.en }),
          U.el('button.btn.btn-go', { type: 'button', text: '▶ ' + b.pages.length })
        ]);
        c.addEventListener('click', function () { A.sfx('pop'); turn(1); });
        stage.appendChild(c);
      }

      function pageWord(p) {
        var w = B.word(p.w);
        if (!w) return turn(1);
        if (p.hide && !revealed) {
          var q = U.el('div.book-peek', {}, [
            U.el('div.peek-ico', { text: '🌿', 'aria-hidden': 'true' }),
            U.el('div.peek-q', { text: '❓' }),
            U.el('button.btn.btn-go', { type: 'button', text: 'என்ன மறைச்சிருக்கு?' })
          ]);
          q.addEventListener('click', function () {
            revealed = true;
            A.unlock(); A.sfx('pop');
            TT.confetti.atEl(q, { count: 14 });
            paint();
          });
          stage.appendChild(q);
          return;
        }
        stage.appendChild(UI.cardEl(w, { size: 'big' }));
        speak(w, false);
      }

      function pageCount(p) {
        var num = B.word(p.num), item = B.word(p.item);
        if (!num || !item) return turn(1);
        var row = U.el('div.count-row');
        for (var i = 0; i < p.n; i++) row.appendChild(UI.miniCard(item));
        var box = U.el('div.book-count', {}, [
          U.el('div.count-num', { text: String(p.n) }),
          U.el('div.count-ta.tamil', { text: num.ta }),
          U.el('div.count-en', { text: num.en }),
          row
        ]);
        box.addEventListener('click', function () { A.sfx('tap'); speakCount(p); });
        stage.appendChild(box);
        speakCount(p);
      }

      function pageQuiz(p) {
        var t = B.word(p.w);
        if (!t) return turn(1);
        if (!quizPicks[idx]) {
          var pool = D.catWords(p.cat || p.w.split('/')[0]).filter(function (w) { return w.id !== t.id; });
          quizPicks[idx] = D.shuffle(pool).slice(0, 2).concat([t]);
          quizPicks[idx] = D.shuffle(quizPicks[idx]);
        }
        var done = false;
        var row = U.el('div.quiz-row');
        quizPicks[idx].forEach(function (w) {
          var c = UI.miniCard(w, function () {
            if (done) return;
            if (w.id === t.id) {
              done = true;
              S.markSeen(t.id); S.markAnswer(t.id, true);
              A.sfx('correct');
              TT.confetti.atEl(row, { count: 20 });
              A.sayWord(t);
              setTimeout(function () { if (auto) turn(1); }, 1200);
            } else {
              /* a guessed-wrong card is a missed recall of the word you were
                 asked for — it belongs in the review box, not just a shake */
              S.markAnswer(t.id, false);
              A.sfx('wrong');
              A.cancel();
              U.qsa('.mini', row).forEach(function (n) { n.classList.remove('nope'); });
              c.classList.add('nope');
              setTimeout(function () { c.classList.remove('nope'); }, 500);
            }
          });
          row.appendChild(c);
        });
        var box = U.el('div.book-quiz', {}, [
          U.el('div.quiz-hint', { text: '🔉' }),
          U.el('div.quiz-q', { text: 'Which one did you hear?' }),
          row
        ]);
        box.querySelector('.quiz-hint').addEventListener('click', function () { A.sfx('tap'); speakQuiz(p); });
        stage.appendChild(box);
        speakQuiz(p);
      }

      function pageLine(p) {
        var box = U.el('div.book-line', {}, [
          U.el('div.line-ta.tamil', { text: p.ta }),
          p.en ? U.el('div.line-en', { text: p.en }) : null
        ]);
        box.addEventListener('click', function () { A.sfx('tap'); speakLine(p); });
        stage.appendChild(box);
        speakLine(p);
      }

      function pageMoral(p) {
        /* the last page of a story is the grown-up sentence the child is left
           with — set it apart from a story line so it reads as the takeaway */
        var box = U.el('div.book-moral', {}, [
          U.el('div.moral-mark', { text: '💡', 'aria-hidden': 'true' }),
          U.el('div.moral-ta.tamil', { text: p.ta }),
          p.ro && S.settings.showRoman ? U.el('div.moral-ro', { text: p.ro }) : null,
          p.en ? U.el('div.moral-en', { text: p.en }) : null
        ]);
        box.addEventListener('click', function () { A.sfx('tap'); speakLine(p); });
        stage.appendChild(box);
        speakLine(p);
      }

      function pageEnd(p) {
        var award = endAwarded ? { firstTime: false } : (endAwarded = true, S.finishBook(b.id));
        var word = B.word(B.firstWord(b));
        /* a word-book pays out a sticker, so it may say so. A story has no
           single word to pin a sticker to — never promise a star the code
           has no intention of delivering */
        var line = !award.firstTime
          ? b.en + ' — read ' + S.bookState(b.id).reads + '×. Again?'
          : (word ? 'That’s a new ⭐ for ' + word.en + '.' : 'The end! Shall we read it again?');
        var box = U.el('div.book-end', {}, [
          U.el('div.end-ico', { text: '🎉', 'aria-hidden': 'true' }),
          U.el('div.end-ta.tamil', { text: b.story
            ? 'நல்லா கதை கேட்டேன். மறுபடி படிப்போமா!'
            : 'நல்லா விளையாடின. மறுபடி விளையாடுவோமா!' }),
          U.el('div.en', { text: line }),
          U.el('div.end-cta', {}, [
            UI.bigButton('மீண்டும்', { icon: '🔁', ta: 'மீண்டும்', color: b.color }, function () {
              idx = 0; revealed = false; quizPicks = {}; endAwarded = false; paint();
            }),
            UI.bigButton('Stars', { icon: '⭐', ta: 'நட்சத்திரம்', color: '#f59e0b' }, function () {
              go('stickers');
            })
          ])
        ]);
        stage.appendChild(box);
        A.sfx('applause');
        TT.confetti.rain();
      }

      /* keyboard: ← → and space, the way the deck already behaves */
      function onKey(e) {
        if (e.key === 'ArrowRight') { turn(1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { turn(-1); e.preventDefault(); }
        else if (e.key === ' ' || e.key === 'Enter') { sayCurrent(); e.preventDefault(); }
      }
      document.addEventListener('keydown', onKey);
      this.onLeave = function () { document.removeEventListener('keydown', onKey); A.cancel(); };

      paint();
    }
  };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/views/games.js ===== */
/* Four games: Listen & Pick, Peek-a-boo, Find-them-all, Say it in English. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data, S = TT.store, UI = TT.ui;
  var views = TT.views;

  var praise = ['சூப்பர்!', 'அருமை!', 'ரொம்ப நல்லா!', 'மெல்ல மெல்ல!', 'ஆமா, அதுதான்!'];

  function sayPraise() {
    var p = U.pickOne(praise);
    A.speakText(p, { lang: 'ta', roman: 'Super!' });
  }

  function gameHeader(title, cat) {
    return U.el('div.game-head', { style: cat ? '--cat:' + cat.color : null }, [
      U.el('button.icon-btn', { type: 'button', 'aria-label': 'Back to games', text: '←' }),
      U.el('h1.game-title', {}, [U.el('span.game-title-en', { text: title }), cat ? U.el('span.game-title-ta.tamil', { text: cat.ta }) : null]),
      U.el('div.game-score', { text: '⭐ 0' })
    ]);
  }

  /* ------------------------------------------------------- topic → game menu */

  views.play = {
    render: function (host, route) {
      if (!route.a) return renderTopics(host);
      if (route.a === 'today') return games.today(host);          // #/play/today — spaced repetition
      var cat = D.getCat(route.a);
      if (!cat) return renderTopics(host);
      if (route.b) return runGame(host, route.b, cat);

      S.settings.lastCategory = cat.key; S.save();
      host.appendChild(UI.sectionHead(cat.ta + ' — விளையாடு', cat.en + ' — choose a game'));
      var wrap = U.el('div.game-menu', {});
      [
        { g: 'listen', icon: '👂', ta: 'கேட்டு சொடுக்கு', en: 'Listen & pick', sub: 'Hear the word, tap the picture' },
        { g: 'peek', icon: '🙈', ta: 'மறைச்சிருக்கு', en: 'Peek-a-boo', sub: 'Lift the leaf, find the word' },
        { g: 'find', icon: '🔎', ta: 'எல்லாம் தேடு', en: 'Find them all', sub: 'Tap every picture from this topic' },
        { g: 'english', icon: '🔤', ta: 'ஆங்கிலத்தில் சொல்', en: 'Say it in English', sub: 'Hear the Tamil, say the English word' }
      ].forEach(function (x) {
        wrap.appendChild(UI.bigButton(x.en, { icon: x.icon, ta: x.ta, sub: x.sub, color: cat.color }, function () {
          TT.app.go('play/' + cat.key + '/' + x.g);
        }));
      });
      host.appendChild(wrap);

      if (S.reviewQueue(cat.key, 3).length) {
        host.appendChild(U.el('div.game-menu', {}, [
          UI.bigButton('Practice these', { icon: '🔁', ta: 'மீண்டும்', sub: 'Words that need help', color: '#e11d48' }, function () {
            TT.app.go('play/' + cat.key + '/review');
          })
        ]));
      }
    }
  };

  function renderTopics(host) {
    host.appendChild(UI.sectionHead('எந்த(topic) விளையாடுவோம்?', 'Which topic should we play with?'));
    var wrap = U.el('div.tile-grid', {});
    D.allCategories().forEach(function (c) {
      var t = UI.catTile(c, '#/play/' + c.key);
      t.classList.add('tile-game');
      wrap.appendChild(t);
    });
    host.appendChild(wrap);
  }

  function runGame(host, name, cat) {
    var f = games[name] || games.listen;
    f(host, cat);
  }

  var games = {};

  /* ------------------------------------------------------- 1 · Listen & Pick */

  games.listen = function (host, cat) {
    var pool = cat ? D.catWords(cat.key) : D.allWords();
    if (pool.length < 2) pool = D.allWords();
    var score = 0, streak = 0, round = 0, ROUNDS = 8, locked = false, current = null, cleanup = [];

    var head = gameHeader('Listen & pick', cat);
    var scoreEl = head.querySelector('.game-score');
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go('play/' + (cat ? cat.key : '')); });
    host.appendChild(head);

    var promptBar = U.el('div.game-prompt', {}, [
      U.el('button.replay-btn', { type: 'button', 'aria-label': 'Say it again' }, [U.el('span', { text: '🔊' })]),
      U.el('p.game-instruction', {}, [U.el('span.tamil', { text: 'கேளு…' }), U.el('span', { text: ' which one did you hear?' })])
    ]);
    host.appendChild(promptBar);

    var board = U.el('div.game-board', {});
    host.appendChild(board);

    promptBar.querySelector('.replay-btn').addEventListener('click', function () {
      if (!current) return;
      A.cancel(); A.sayWord(current);
      this.classList.remove('pulse'); void this.offsetWidth; this.classList.add('pulse');
    });

    function nextRound() {
      round++;
      if (round > ROUNDS) return endGame();
      locked = false;

      /* bias towards words the child hasn't mastered */
      var weighted = pool.map(function (w) {
        var l = S.level(w.id);
        return { w: w, s: (l === 0 ? 5 : l === 1 ? 4 : l === 2 ? 2 : 1) + Math.random() * 3 };
      }).sort(function (a, b) { return b.s - a.s; });
      current = weighted[0].w;

      var n = U.clamp(2 + Math.floor(streak / 3), 2, 4);
      var opts = [current];
      var others = D.shuffle(pool).filter(function (w) { return w.id !== current.id; });
      for (var i = 0; i < others.length && opts.length < n; i++) {
        if (!opts.some(function (o) { return o.img === others[i].img; })) opts.push(others[i]);
      }
      opts = D.shuffle(opts);

      U.clear(board);
      board.className = 'game-board n' + opts.length;
      var cards = {};
      opts.forEach(function (w) {
        var c = UI.cardEl(w, { size: 'tile', speak: false, showSay: false, flip: false });
        c.classList.add('choice');
        c.addEventListener('click', function () { choose(w, c); });
        cards[w.id] = c;
        board.appendChild(c);
      });

      setTimeout(function () {
        A.cancel();
        A.sayWord(current, { repeats: 2 });
      }, 450);
    }

    function choose(w, node) {
      if (locked) return;
      A.unlock();
      if (w.id === current.id) {
        locked = true;
        streak++; score++;
        scoreEl.textContent = '⭐ ' + score;
        S.markAnswer(current.id, true);
        node.classList.add('right');
        A.cancel(); A.sfx('correct');
        TT.confetti.atEl(node, { count: 34 });
        U.haptic([12, 40, 18]);
        setTimeout(function () {
          A.speakText(U.pickOne(praise), { lang: 'ta' });
          A.sayWord(current, { repeats: 1, onend: function () { setTimeout(nextRound, 500); } });
        }, 350);
        if (score % 4 === 0 && S.settings.rewardStars !== false) {
          S.addSticker(current.id, current.cat);
          UI.toast('⭐ Star for you!');
          var badge = document.getElementById('star-count'); if (badge) badge.textContent = S.progress.stickers.length;
        }
      } else {
        streak = 0;
        S.markAnswer(current.id, false);
        node.classList.remove('wrong'); void node.offsetWidth; node.classList.add('wrong');
        A.cancel(); A.sfx('wrong'); U.haptic(60);
        A.speakText('இன்னொரு தடவை கேட்கிறேன்', { lang: 'ta', roman: 'Inna thadavai ketkiren' });
        setTimeout(function () { A.sayWord(current, { repeats: 2 }); }, 900);
      }
    }

    function endGame() {
      U.clear(board);
      var panel = U.el('div.game-done', {}, [
        U.el('div.done-emoji', { text: score >= ROUNDS * 0.7 ? '🏆' : '🌟' }),
        U.el('h2.tamil', { text: 'நல்லா விளையாடின' }),
        U.el('p', { text: score + ' out of ' + ROUNDS + ' correct' }),
        U.el('div.done-actions', {}, [
          UI.bigButton('Again', { icon: '🔁', color: cat ? cat.color : '#7c3aed' }, function () { score = 0; streak = 0; round = 0; scoreEl.textContent = '⭐ 0'; nextRound(); }),
          UI.bigButton('Peek-a-boo', { icon: '🙈', color: '#0ea5e9' }, function () { TT.app.go('play/' + (cat ? cat.key : 'all') + '/peek'); }),
          UI.bigButton('Topics', { icon: '📚', color: '#16a34a' }, function () { TT.app.go('learn'); })
        ])
      ]);
      board.appendChild(panel);
      A.sfx('applause'); TT.confetti.rain({ count: 60 });
      A.speakText('நல்லா விளையாடின. மறுபடி விளையாடுவோமா!', { lang: 'ta', roman: 'Nalla vilaiyadina. Marubadi vilaiyaduroma!' });
    }

    views.play.onLeave = function () {
      cleanup.forEach(function (f) { f(); });
      A.cancel();
    };
    nextRound();
  };

  /* ------------------------------------------------------------ 2 · Peekaboo */

  games.peek = function (host, cat) {
    var pool = cat ? D.catWords(cat.key) : D.allWords();
    var score = 0;
    var head = gameHeader('Peek-a-boo', cat);
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go('play/' + (cat ? cat.key : '')); });
    host.appendChild(head);
    host.appendChild(U.el('div.game-prompt', {}, [
      U.el('span.replay-btn.static', { text: '🙈' }),
      U.el('p.game-instruction', {}, [U.el('span.tamil', { text: 'என்ன மறைச்சிருக்கு?' }), U.el('span', { text: ' tap the leaves to look' })])
    ]));

    var board = U.el('div.peek-board', {});
    host.appendChild(board);

    function deal() {
      U.clear(board);
      score = 0;
      var batch = D.shuffle(pool).slice(0, Math.min(6, pool.length));
      var opened = 0;
      batch.forEach(function (w) {
        var b = U.el('button.curtain', { type: 'button', 'aria-label': 'What is hiding here?' }, [
          U.el('span.curtain-leaf', { text: '🍃' }),
          U.el('span.curtain-peek', { html: UI.pictureHTML(w) })
        ]);
        b.addEventListener('click', function () {
          if (b.classList.contains('open')) { A.cancel(); A.sayWord(w); return; }
          b.classList.add('open');
          opened++;
          S.markSeen(w.id);
          A.unlock(); A.cancel(); A.sfx('pop');
          TT.confetti.burst(
            b.getBoundingClientRect().left + b.offsetWidth / 2,
            b.getBoundingClientRect().top + b.offsetHeight / 2, { count: 20 }
          );
          setTimeout(function () {
            A.sayWord(w, { onend: function () { if (opened === batch.length) celebrate(); } });
          }, 120);
        });
        board.appendChild(b);
      });
      setTimeout(function () {
        A.cancel();
        A.speakText('என்ன மறைச்சிருக்கு? பாப்போம்!', { lang: 'ta', roman: 'Enna marachirukku? Paappom!' });
      }, 300);
    }

    function celebrate() {
      A.sfx('applause');
      TT.confetti.rain({ count: 50 });
      var again = U.el('div.game-done.inline', {}, [
        U.el('p', { text: 'You found them all!' }),
        UI.bigButton('New ones', { icon: '🔁', color: cat ? cat.color : '#7c3aed' }, deal),
        UI.bigButton('Games', { icon: '🎲', color: '#7e22ce' }, function () { TT.app.go('play/' + (cat ? cat.key : '')); })
      ]);
      board.appendChild(again);
    }

    views.play.onLeave = function () { A.cancel(); };
    deal();
  };

  /* --------------------------------------------------------- 3 · Find them all */

  games.find = function (host, cat) {
    var targetCat = cat || null;
    var score = 0, round = 0;
    var head = gameHeader('Find them all', targetCat);
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go('play/' + (targetCat ? targetCat.key : '')); });
    host.appendChild(head);
    var prompt = U.el('div.game-prompt', {}, [
      U.el('button.replay-btn', { type: 'button', 'aria-label': 'Say the instruction again' }, [U.el('span', { text: '🔊' })]),
      U.el('p.game-instruction', {})
    ]);
    host.appendChild(prompt);
    var board = U.el('div.find-board', {});
    host.appendChild(board);

    function instruction(wantCat) {
      A.cancel();
      A.speakText(wantCat.ta + ' எல்லாத்தையும் சொடுக்கு', { lang: 'ta', roman: wantCat.en + ' — tap them all!' });
    }
    prompt.querySelector('.replay-btn').addEventListener('click', function () { if (board._want) instruction(board._want); });

    function nextRound() {
      round++;
      U.clear(board);
      var want = targetCat || D.pickOne(D.allCategories().filter(function (c) { return c.words.length >= 5; }));
      var others = D.allCategories().filter(function (c) { return c.key !== want.key; });
      var other = U.pickOne(others);
      board._want = want;

      var targets = D.shuffle(want.words).slice(0, 5);
      var dummies = D.shuffle(other.words).filter(function (w) {
        return !targets.some(function (t) { return t.img === w.img; });
      }).slice(0, 4);
      var tiles = D.shuffle(targets.concat(dummies));

      prompt.querySelector('.game-instruction').innerHTML = '';
      U.append(prompt.querySelector('.game-instruction'), [
        U.el('span.tamil', { text: want.ta }),
        U.el('span', { text: ' — tap all the ' + want.en.toLowerCase() })
      ]);

      var left = targets.length;
      tiles.forEach(function (w) {
        var c = UI.cardEl(w, { size: 'tile', speak: false, showSay: false, flip: false });
        c.classList.add('choice');
        c.addEventListener('click', function () {
          if (c.classList.contains('found')) { A.cancel(); A.sayWord(w); return; }
          if (targets.some(function (t) { return t.id === w.id; })) {
            c.classList.add('found');
            left--; score++;
            S.markAnswer(w.id, true);
            head.querySelector('.game-score').textContent = '⭐ ' + score;
            A.cancel(); A.sfx('ding'); A.sayWord(w, { repeats: 1 });
            TT.confetti.atEl(c, { count: 18 });
            if (left === 0) setTimeout(win, 600);
          } else {
            c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong');
            A.cancel(); A.sfx('wrong');
            A.speakText('அது ' + w.en + ' — ' + w.ta + '. ' + want.ta + ' தேடு', { lang: 'ta', roman: 'That is ' + w.en + '. Find the ' + want.en });
          }
        });
        board.appendChild(c);
      });

      setTimeout(function () { instruction(want); }, 400);
    }

    function win() {
      A.sfx('applause'); TT.confetti.rain({ count: 55 });
      A.speakText('எல்லாம் கண்டுபிடிச்சுட்ட. அருமை!', { lang: 'ta', roman: 'Nalla found! Arumai!' });
      if (S.settings.rewardStars !== false) { S.addSticker(null, targetCat ? targetCat.key : 'all'); }
      var badge = document.getElementById('star-count'); if (badge) badge.textContent = S.progress.stickers.length;
      U.clear(board);
      U.append(board, U.el('div.game-done', {}, [
        U.el('div.done-emoji', { text: '🎊' }),
        U.el('h2.tamil', { text: 'எல்லாம் கண்டுபிடிச்சுட்ட!' }),
        U.el('div.done-actions', {}, [
          UI.bigButton('More', { icon: '🔁', color: '#16a34a' }, nextRound),
          UI.bigButton('Games', { icon: '🎲', color: '#7e22ce' }, function () { TT.app.go('play/' + (targetCat ? targetCat.key : '')); })
        ])
      ]));
    }

    views.play.onLeave = function () { A.cancel(); };
    nextRound();
  };

  /* ------------------------------------------- Today's review (spaced repetition)
     Overdue words first — the ones got wrong lately and the ones in low boxes —
     plus a couple of brand-new words so the deck never feels like a chore. */
  games.today = function (host) {
    var words = S.todayWords ? S.todayWords(8) : S.reviewQueue(null, 8);
    if (!words || words.length < 2) {
      UI.toast('Nothing due today — play a game instead!');
      TT.app.go('play');
      return;
    }
    games.review(host, null, { words: words, title: "Today's review", back: 'home' });
  };

  /* ------------------------------------------- Say it in English (speaking) */
  /* Parent-mediated: the child hears the Tamil word, looks at the picture and
     says the English one. No grading — grown-up taps the star when it's said. */
  games.english = function (host, cat) {
    var pool = (cat ? D.catWords(cat.key) : D.allWords());
    if (!pool.length) pool = D.allWords();
    /* words that need the most help come first */
    var order = pool.slice().sort(function (a, b) {
      return (S.level(a.id) - S.level(b.id)) || (Math.random() - 0.5);
    });
    var TOTAL = 6, at = 0, round = 0, score = 0, current = null, answered = false;

    var head = gameHeader('Say it in English', cat);
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go('play/' + (cat ? cat.key : '')); });
    host.appendChild(head);
    var scoreEl = head.children[2];

    host.appendChild(U.el('div.game-prompt', {}, [
      U.el('button.replay-btn', { type: 'button', 'aria-label': 'Hear it again', text: '🔊' }),
      U.el('p.game-instruction', {}, [U.el('span.tamil', { text: 'ஆங்கிலத்தில் சொல்லு!' }), U.el('span', { text: ' hear it in Tamil, then say the English word' })])
    ]));
    host.querySelector('.replay-btn').addEventListener('click', function () {
      if (!current) return;
      A.unlock(); A.cancel(); A.sayWord(current, { only: 'ta', repeats: 1 });
    });

    var stage = U.el('div.card-stage.card-stage-solo', {}, U.el('div.card-pic', {}));
    host.appendChild(stage);
    var picBox = stage.querySelector('.card-pic');
    var answer = U.el('div.card-words.answer-row', {});
    host.appendChild(answer);
    var actions = U.el('div.game-menu', {});
    host.appendChild(actions);

    function askAgain() {
      if (!current) return;
      A.unlock(); A.cancel();
      A.sayWord(current, { only: 'ta', repeats: 1 });
    }

    function reveal() {
      if (!current) return;
      answered = true;
      U.clear(answer);
      U.append(answer, U.el('div.w-en.answer-word', { text: current.en }));
      if (S.settings.showRoman !== false) U.append(answer, U.el('div.w-ro', { text: current.ro }));
      A.unlock(); A.cancel();
      A.sayWord(current, { only: 'en', repeats: 1 });      // slow if the recording slider is down
      U.clear(actions);
      actions.appendChild(UI.bigButton('He said it!', { icon: '⭐', color: '#f59e0b', sub: 'tap for the star', }, gotIt));
      actions.appendChild(UI.bigButton('Next word', { icon: '➡️', color: cat ? cat.color : '#7c3aed', sub: 'skip this one' }, next));
    }

    function gotIt() {
      if (!current) return;
      score++;
      scoreEl.textContent = '⭐ ' + score;
      S.markAnswer(current.id, true);
      A.sfx('correct'); sayPraise();
      TT.confetti.burst(window.innerWidth / 2, window.innerHeight * 0.4, { count: 26 });
      if (S.settings.rewardStars !== false && score % 3 === 0) {
        S.addSticker(current.id, current.cat);
        var badge = document.getElementById('star-count');
        if (badge) badge.textContent = S.progress.stickers.length;
        TT.confetti.burst(window.innerWidth / 2, window.innerHeight * 0.3, { count: 34 });
        A.sfx('sparkle');
        UI.toast('⭐ Star for you!');
      }
      setTimeout(next, 700);
    }

    function next() {
      round++;
      if (round > TOTAL) return finish();
      answered = false;
      current = order[at % order.length]; at++;
      S.markSeen(current.id);
      U.clear(picBox); U.clear(answer); U.clear(actions);
      U.append(picBox, U.el('span.pic', { html: UI.pictureHTML(current) }));
      answer.appendChild(U.el('div.w-ro', { text: '🤫 the English word is hiding' }));
      actions.appendChild(UI.bigButton('Show the word', { icon: '👀', color: '#0ea5e9', sub: 'tap if you need a hint' }, reveal));
      actions.appendChild(UI.bigButton('He said it!', { icon: '⭐', color: '#f59e0b', sub: 'tap for the star' }, gotIt));
      setTimeout(askAgain, 350);
    }

    function finish() {
      U.clear(actions);
      A.cancel(); A.sfx('applause'); TT.confetti.rain({ count: 50 });
      actions.appendChild(U.el('div.game-done.inline', {}, [
        U.el('p', { text: 'You said ' + score + ' of ' + TOTAL + ' words in English!' }),
        UI.bigButton('Again', { icon: '🔁', color: cat ? cat.color : '#7c3aed' }, function () {
          score = 0; round = 0; at = 0; scoreEl.textContent = '⭐ 0';
          order = D.shuffle(pool.slice()); next();
        }),
        UI.bigButton('Games', { icon: '🎲', color: '#7e22ce' }, function () { TT.app.go('play/' + (cat ? cat.key : '')); })
      ]));
    }

    views.play.onLeave = function () { A.cancel(); };
    next();
  };

  /* review mode = Listen & Pick over the words that need help */
  games.review = function (host, cat, opts) {
    opts = opts || {};
    var q = opts.words || S.reviewQueue(cat ? cat.key : null, 10);
    if (q.length < 2) { UI.toast('Nothing to practise — well done!'); TT.app.go(opts.back || ('play/' + (cat ? cat.key : ''))); return; }
    var score = 0, streak = 0, round = 0, ROUNDS = Math.min(8, q.length), locked = false, current = null;
    var head = gameHeader(opts.title || 'Practise', cat);
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go(opts.back || ('play/' + (cat ? cat.key : ''))); });
    host.appendChild(head);
    var promptBar = U.el('div.game-prompt', {}, [
      U.el('button.replay-btn', { type: 'button' }, [U.el('span', { text: '🔊' })]),
      U.el('p.game-instruction', {}, [U.el('span.tamil', { text: 'இது நமக்கு கஷ்டம் —' }), U.el('span', { text: ' listen and tap it' })])
    ]);
    host.appendChild(promptBar);
    var board = U.el('div.game-board', {});
    host.appendChild(board);
    promptBar.querySelector('.replay-btn').addEventListener('click', function () { if (current) { A.cancel(); A.sayWord(current); } });

    (function next() {
      round++;
      if (round > ROUNDS) {
        U.clear(board);
        U.append(board, U.el('div.game-done', {}, [
          U.el('div.done-emoji', { text: '💪' }),
          U.el('p', { text: score + ' / ' + ROUNDS + ' right' }),
          UI.bigButton('Back to games', { icon: '🎲', color: '#e11d48' }, function () { TT.app.go('play/' + (cat ? cat.key : '')); })
        ]));
        A.sfx('applause');
        return;
      }
      locked = false;
      current = q[(round - 1) % q.length];
      var others = D.shuffle(D.catWords(current.cat).concat(D.allWords())).filter(function (w) { return w.id !== current.id && w.img !== current.img; });
      var opts = D.shuffle([current].concat(others.slice(0, U.clamp(2 + Math.floor(streak / 2), 2, 3))));
      U.clear(board);
      board.className = 'game-board n' + opts.length;
      opts.forEach(function (w) {
        var c = UI.cardEl(w, { size: 'tile', speak: false, showSay: false, flip: false });
        c.classList.add('choice');
        c.addEventListener('click', function () {
          if (locked) return;
          if (w.id === current.id) {
            locked = true; streak++; score++;
            S.markAnswer(current.id, true);
            c.classList.add('right');
            A.cancel(); A.sfx('correct'); TT.confetti.atEl(c, { count: 30 });
            A.sayWord(current, { repeats: 1, onend: function () { setTimeout(next, 400); } });
          } else {
            streak = 0;
            c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong');
            A.cancel(); A.sfx('wrong'); A.sayWord(current, { repeats: 2 });
          }
        });
        board.appendChild(c);
      });
      setTimeout(function () { A.cancel(); A.sayWord(current, { repeats: 2 }); }, 420);
    })();
    views.play.onLeave = function () { A.cancel(); };
  };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/views/stickers.js ===== */
/* Sticker board — every star the child has earned, tappable to hear the word. */
(function (TT) {

      var grid = U.el('div.sticker-grid', {});

        else node = U.el('button.mini', { type: 'button' }, [

})(window.TT = window.TT || {});
