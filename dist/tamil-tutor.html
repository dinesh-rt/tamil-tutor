<style>
/* ===== css/app.css ===== */
/* ==========================================================================
   Tamil Tutor — layout & look
   Little fingers first: everything tappable is at least 64px, nothing scrolls
   sideways, and the words are enormous.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
  --font-ta: "Noto Sans Tamil", "Nirmala UI", "Tamil MN", "Latha", "Noto Sans", system-ui, sans-serif;
  --font-round: "Comic Sans MS", "Chalkboard SE", "Baloo Chettan 2", var(--font-ui);

  --sun: #ffd166;
  --sky: #7dd3fc;
  --grape: #7c3aed;
  --grape-2: #a855f7;
  --leaf: #16a34a;
  --rose: #f43f5e;
  --ink: #1f2430;
  --ink-soft: #4b5563;

  --bg-1: #fff7e6;
  --bg-2: #e0f2fe;
  --bg-3: #fde2f3;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e5e7eb;
  --shadow: 0 10px 0 rgba(31, 36, 48, .08), 0 18px 34px rgba(31, 36, 48, .14);
  --shadow-soft: 0 6px 20px rgba(31, 36, 48, .10);
  --radius: 26px;
  --radius-lg: 36px;

  --topbar-h: 62px;
  --tabbar-h: 78px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html[data-theme="night"] {
  --bg-1: #1b1030;
  --bg-2: #0b1b33;
  --bg-3: #2a1046;
  --surface: #241a3d;
  --surface-2: #2e2350;
  --line: #3b2f5f;
  --ink: #f5f3ff;
  --ink-soft: #c7c2e0;
  --shadow: 0 10px 0 rgba(0, 0, 0, .35), 0 18px 34px rgba(0, 0, 0, .45);
  --shadow-soft: 0 6px 22px rgba(0, 0, 0, .5);
}

html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--bg-1);
  background-image:
    radial-gradient(120% 90% at 10% -10%, var(--bg-1) 0%, transparent 60%),
    radial-gradient(120% 90% at 110% 10%, var(--bg-3) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 45%, var(--surface-2) 100%);
  background-attachment: fixed;
  min-height: 100%;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding-top: calc(var(--topbar-h) + var(--safe-top));
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom));
}

.tamil { font-family: var(--font-ta); line-height: 1.5; }
[hidden] { display: none !important; }

/* ------------------------------------------------------------ background */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-shape { position: absolute; top: -12%; will-change: transform; filter: saturate(.85); }

/* ---------------------------------------------------------------- top bar */
.topbar {
  position: fixed; z-index: 30; top: 0; left: 0; right: 0;
  height: calc(var(--topbar-h) + var(--safe-top));
  padding: var(--safe-top) 10px 0;
  display: flex; align-items: center; gap: 8px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(12px) saturate(1.3);
  -webkit-backdrop-filter: blur(12px) saturate(1.3);
  border-bottom: 2px solid color-mix(in srgb, var(--grape) 18%, var(--line));
  box-shadow: 0 4px 18px rgba(31,36,48,.08);
}

.icon-btn {
  min-width: 48px; min-height: 48px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 18px;
  font-size: 1.35rem; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(31,36,48,.08);
  transition: transform .12s ease, box-shadow .12s ease;
  position: relative;
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.nav-back { font-size: 1.5rem; font-weight: 700; }

.brand {
  display: flex; align-items: center; gap: 8px;
  border: 0; background: none; padding: 6px 8px; margin-right: auto;
  cursor: pointer; color: inherit; position: relative;
}
.brand-ico { font-size: 1.9rem; line-height: 1; }
.brand-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.brand-ta { font-family: var(--font-ta); font-size: 1.05rem; font-weight: 700; color: var(--grape); }
.brand-en { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.hold-ring {
  position: absolute; inset: -2px; border-radius: 20px;
  border: 3px dashed var(--grape);
  animation: holdfill 3s linear forwards;
}

.topbar-actions { display: flex; gap: 6px; }
.badge {
  position: absolute; right: -4px; top: -4px;
  min-width: 22px; height: 22px; padding: 0 5px;
  background: var(--rose); color: #fff;
  border-radius: 999px; font-size: .72rem; font-weight: 800;
  display: grid; place-items: center;
  box-shadow: 0 2px 0 rgba(0,0,0,.15);
}

/* ------------------------------------------------------------------ tabs */
.tabbar {
  position: fixed; z-index: 30; bottom: 0; left: 0; right: 0;
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 2px solid color-mix(in srgb, var(--grape) 18%, var(--line));
}
.tab {
  border: 0; background: none; cursor: pointer; color: var(--ink-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 6px 2px; font-family: inherit;
}
.tab-ico { font-size: 1.7rem; line-height: 1.1; }
.tab-ta { font-family: var(--font-ta); font-size: .82rem; font-weight: 700; }
.tab-en { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; }
.tab.on { color: var(--grape); }
.tab.on .tab-ico { transform: translateY(-2px) scale(1.12); }
.tab.on::after {
  content: ""; position: absolute; bottom: 8px; width: 26px; height: 5px;
  border-radius: 99px; background: var(--grape);
}
.tab { position: relative; }

/* ------------------------------------------------------------------ view */
.view {
  position: relative; z-index: 1;
  max-width: 880px; margin: 0 auto;
  padding: 12px 14px 24px;
}

.section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 22px 2px 12px; }
.section-ta { font-family: var(--font-ta); font-size: 1.5rem; font-weight: 800; margin: 0; color: var(--grape); }
.section-en { margin: 0; font-size: .92rem; color: var(--ink-soft); flex: 1 1 100%; }
.section-head .chip { margin-left: auto; }
.empty { padding: 18px; text-align: center; color: var(--ink-soft); font-size: 1.05rem; }
.foot-note { margin: 26px 6px 8px; font-size: .84rem; color: var(--ink-soft); text-align: center; }
.linkish { border: 0; background: none; color: var(--grape); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

/* ------------------------------------------------------------------ hero */
.hero {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-soft);
  border: 3px solid color-mix(in srgb, var(--grape) 16%, var(--line));
  margin-top: 6px;
}
.hero-small { padding: 12px 14px; }
.hero-mascot { font-size: 3.6rem; line-height: 1; cursor: pointer; }
.hero-elephant { display: inline-block; }
.hero-ta { font-family: var(--font-ta); font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; line-height: 1.25; color: var(--grape); }
.hero-en { margin: 2px 0 8px; font-size: 1.05rem; color: var(--ink-soft); }
.hero-stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
.stat-pill {
  background: color-mix(in srgb, var(--grape) 12%, var(--surface));
  border: 2px solid color-mix(in srgb, var(--grape) 22%, transparent);
  color: var(--ink); border-radius: 99px; padding: 3px 10px; font-size: .82rem; font-weight: 700;
}

/* -------------------------------------------------------- rows and minis */
.row { margin-bottom: 6px; }
.row-cta { display: flex; flex-wrap: wrap; gap: 10px; }

.big-btn {
  flex: 1 1 220px;
  display: flex; align-items: center; gap: 12px;
  min-height: 72px; padding: 12px 16px;
  border: 3px solid color-mix(in srgb, var(--cat, var(--grape)) 55%, #000 5%);
  border-radius: var(--radius);
  background: linear-gradient(160deg, color-mix(in srgb, var(--cat, var(--grape)) 22%, var(--surface)), color-mix(in srgb, var(--cat, var(--grape)) 10%, var(--surface)));
  color: var(--ink); font: inherit; cursor: pointer; text-align: left;
  box-shadow: 0 7px 0 color-mix(in srgb, var(--cat, var(--grape)) 32%, transparent), var(--shadow-soft);
  transition: transform .1s ease, box-shadow .1s ease;
}
.big-btn:active { transform: translateY(6px); box-shadow: var(--shadow-soft); }
.big-btn-ico { font-size: 2.1rem; line-height: 1; }
.big-btn-label { display: flex; flex-direction: column; font-size: 1.15rem; font-weight: 800; }
.big-btn-ta { font-family: var(--font-ta); font-size: .95rem; font-weight: 700; color: var(--ink-soft); }
.big-btn-sub { font-size: .78rem; color: var(--ink-soft); margin-left: auto; align-self: center; }

.mini-row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }

.mini {
  flex: 0 0 auto; width: 104px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 6px 8px;
  border: 3px solid color-mix(in srgb, var(--grape) 18%, var(--line));
  border-radius: 22px;
  background: var(--surface);
  font: inherit; color: inherit; cursor: pointer;
  box-shadow: 0 5px 0 rgba(31,36,48,.07);
  scroll-snap-align: start;
  transition: transform .12s ease;
}
.mini:active { transform: scale(.94); }
.mini-pic { font-size: 2.1rem; line-height: 1.15; display: block; }
.mini-ta { font-family: var(--font-ta); font-size: .96rem; font-weight: 700; text-align: center; line-height: 1.35; }
.mini-en { font-size: .72rem; color: var(--ink-soft); text-align: center; }
.sticker { border-color: color-mix(in srgb, #f59e0b 55%, var(--line)); background: linear-gradient(170deg, #fffbeb, var(--surface)); }

/* --------------------------------------------------------------- tiles */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 1px;
  padding: 14px 14px 18px; min-height: 128px;
  text-decoration: none; color: inherit; font: inherit;
  background: linear-gradient(165deg, color-mix(in srgb, var(--cat) 24%, var(--surface)), var(--surface) 70%);
  border: 3px solid color-mix(in srgb, var(--cat) 45%, transparent);
  border-radius: var(--radius);
  box-shadow: 0 7px 0 color-mix(in srgb, var(--cat) 26%, transparent);
  overflow: hidden;
  transition: transform .14s ease;
}
.tile:active { transform: translateY(5px) scale(.99); box-shadow: none; }
.tile-icon { font-size: 2.3rem; line-height: 1.1; }
.tile-ta { font-family: var(--font-ta); font-size: 1.15rem; font-weight: 800; line-height: 1.4; }
.tile-en { font-size: .82rem; color: var(--ink-soft); }
.tile-count { position: absolute; right: 12px; top: 12px; font-size: .68rem; font-weight: 800; color: color-mix(in srgb, var(--cat) 70%, var(--ink)); background: color-mix(in srgb, var(--cat) 14%, var(--surface)); padding: 2px 8px; border-radius: 99px; }
.tile-bar { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 7px; border-radius: 99px; background: color-mix(in srgb, var(--cat) 15%, var(--line)); overflow: hidden; }
.tile-bar-fill { display: block; height: 100%; border-radius: 99px; background: var(--cat); }
.tile-game::after { content: "🎲"; position: absolute; right: 10px; bottom: 20px; font-size: 1.3rem; opacity: .55; }

/* ---------------------------------------------------------------- cards */
.card {
  position: relative;
  background: var(--surface);
  border: 4px solid color-mix(in srgb, var(--cat, var(--grape)) 34%, var(--line));
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column;
}
.card-big { width: min(94%, 520px); margin: 0 auto; min-height: min(62vh, 470px); justify-content: center; }
.card-tile { padding: 10px; }
.card:focus-visible { outline: 5px solid var(--sun); outline-offset: 3px; }
.card-body { display: flex; flex-direction: column; height: 100%; min-width: 0; }
.card-stage { flex: 1 1 auto; display: grid; place-items: center; padding: 18px 12px 4px; min-height: 0; min-width: 0; }
.card-pic { display: block; max-width: 100%; }
.card-pic > .pic { display: inline-block; max-width: 100%; }
.pic { display: inline-block; line-height: 1; }
.emoji { font-size: clamp(4.6rem, 26vw, 9rem); display: inline-block; }
.card-tile .emoji { font-size: clamp(3rem, 13vw, 4.6rem); }
.emoji-grid { display: grid; gap: 2px; justify-items: center; }
.emoji-grid .emoji { font-size: clamp(1.9rem, 8vw, 2.8rem); }
.emoji-grid.n-1 { grid-template-columns: 1fr; }
.emoji-grid.n-2, .emoji-grid.n-4 { grid-template-columns: repeat(2, 1fr); }
.emoji-grid.n-3, .emoji-grid.n-6 { grid-template-columns: repeat(3, 1fr); }
.emoji-grid.n-5, .emoji-grid.n-7, .emoji-grid.n-8, .emoji-grid.n-9, .emoji-grid.n-10 { grid-template-columns: repeat(4, 1fr); }
.sym-badge {
  position: absolute; left: 16px; top: 12px;
  font-family: var(--font-ta); font-size: 2.6rem; font-weight: 800; color: var(--grape); opacity: .9;
}
.card-pic svg, .card-pic .sprite { width: min(58vw, 260px); max-width: 100%; height: auto; display: block; }
.card-tile .card-pic svg { width: min(26vw, 130px); }

.card-words { padding: 4px 16px 18px; text-align: center; display: grid; gap: 2px; }
.w-ta { font-family: var(--font-ta); font-size: clamp(2rem, 9vw, 3.1rem); font-weight: 800; line-height: 1.5; color: var(--ink); overflow-wrap: break-word; }
.card-tile .w-ta { font-size: clamp(1.2rem, 5.4vw, 1.7rem); line-height: 1.4; }
.w-ro { font-size: 1rem; color: var(--ink-soft); font-style: italic; letter-spacing: .02em; }
.w-en { font-size: clamp(1.05rem, 4.4vw, 1.5rem); font-weight: 700; color: color-mix(in srgb, var(--grape) 78%, var(--ink)); overflow-wrap: break-word; }
.big-ta { font-size: clamp(2.4rem, 11vw, 3.6rem); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 2px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer;
  box-shadow: 0 3px 0 rgba(31,36,48,.06);
}
.chip:active { transform: translateY(2px); box-shadow: none; }
.chip-say { margin: 6px auto 0; justify-content: center; border-color: color-mix(in srgb, var(--leaf) 40%, var(--line)); background: color-mix(in srgb, var(--leaf) 10%, var(--surface)); }
.chip-say .tamil { font-size: .95rem; }
.chip-ico { font-size: 1.05rem; }
.chip-danger { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.level-dot { position: absolute; right: 14px; top: 14px; width: 16px; height: 16px; border-radius: 99px; background: #9ca3af; box-shadow: 0 0 0 4px rgba(0,0,0,.05); }
.level-dot[data-lvl="1"] { background: #f59e0b; }
.level-dot[data-lvl="2"] { background: #22c55e; }
.level-dot[data-lvl="3"] { background: #16a34a; box-shadow: 0 0 0 4px rgba(34,197,94,.25); }

/* flip cards */
.card-flip { perspective: 1200px; }
.card-flip .face { backface-visibility: hidden; transition: transform .45s cubic-bezier(.2,.9,.2,1); grid-area: 1/1; }
.card-flip { display: grid; }
.card-flip .face.back { transform: rotateY(180deg); }
.card-flip[data-side="back"] .face.front { transform: rotateY(-180deg); }
.card-flip[data-side="back"] .face.back { transform: rotateY(0deg); }
.flip-words { text-align: center; display: grid; gap: 4px; }

/* ------------------------------------------------------- flashcard deck */
.deck-bar { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.deck-meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.deck-cat { font-family: var(--font-ta); font-weight: 800; font-size: 1.1rem; }
.deck-count { font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.deck-progress { flex: 1 1 auto; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--grape) 14%, var(--line)); overflow: hidden; }
.deck-progress-fill { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }

.deck-stage {
  position: relative; display: grid; place-items: center;
  min-height: min(62vh, 470px);
  touch-action: pan-y;
}
.deck-stage .card { grid-area: 1/1; }
.autoplay-ring {
  position: absolute; inset: auto 6px 6px auto; width: 46px; height: 46px; border-radius: 99px;
  display: none;
}
.autoplay-ring.on {
  display: block;
  background: conic-gradient(var(--grape) var(--p, 0%), color-mix(in srgb, var(--grape) 15%, transparent) 0);
  border-radius: 99px;
  opacity: .85;
}
.nav-arrow, .nav-hint { border: 0; background: none; font: inherit; cursor: pointer; color: inherit; }
.deck-nav {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  margin-top: 10px;
}
.nav-arrow {
  min-height: 84px; border-radius: 26px;
  background: var(--surface); border: 3px solid color-mix(in srgb, var(--grape) 30%, var(--line));
  box-shadow: 0 7px 0 color-mix(in srgb, var(--grape) 22%, transparent);
  font-size: 2.2rem; color: var(--grape);
}
.nav-arrow:active { transform: translateY(6px); box-shadow: none; }
.nav-arrow span { display: block; }
.nav-hint { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-soft); padding: 8px 14px; }
.nav-hint span { font-size: 1.8rem; }
.nav-hint small { font-size: .72rem; }

.deck-done, .game-done { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 22px 10px; width: 100%; }
.game-done.inline { padding: 14px; }
.done-emoji { font-size: 4rem; }
.deck-done h2, .game-done h2 { font-family: var(--font-ta); font-size: clamp(1.7rem, 7vw, 2.4rem); margin: 0; color: var(--grape); }
.done-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }

/* -------------------------------------------------------------- games */
.game-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.game-title { margin: 0; font-size: 1.15rem; display: flex; flex-direction: column; line-height: 1.15; flex: 1 1 auto; }
.game-title-ta { font-family: var(--font-ta); color: var(--cat, var(--grape)); font-size: 1.2rem; }
.game-score { font-weight: 800; font-size: 1.2rem; background: var(--surface); border: 2px solid var(--line); padding: 6px 12px; border-radius: 99px; }

.game-prompt {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border-radius: var(--radius);
  border: 3px dashed color-mix(in srgb, var(--cat, var(--grape)) 35%, var(--line));
  padding: 10px 14px; margin-bottom: 14px;
}
.replay-btn {
  min-width: 72px; min-height: 72px; border-radius: 99px; font-size: 2rem;
  border: 3px solid var(--grape); background: color-mix(in srgb, var(--sun) 45%, var(--surface));
  cursor: pointer; box-shadow: 0 6px 0 color-mix(in srgb, var(--grape) 25%, transparent);
}
.replay-btn:active { transform: translateY(5px); box-shadow: none; }
.replay-btn.static { cursor: default; }
.game-instruction { margin: 0; font-size: 1.08rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.game-instruction .tamil { font-size: 1.3rem; font-weight: 800; color: var(--grape); }

.game-board { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.game-board.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.game-board.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .game-board.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.game-board .card { min-height: 150px; }
.choice.right { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 10%, var(--surface)); }
.choice.wrong { border-color: var(--rose); }

<script>
/* ===== js/data/core.js ===== */
/* ==========================================================================
   Tamil Tutor — data registry
   --------------------------------------------------------------------------
   Words and categories are registered here by the files in js/data/.
   Every data file calls:

     TT.data.category({ key:"animals", en:"Animals", ta:"விலங்குகள்", icon:"🐘", color:"#f97316" });
     TT.data.words("animals", [ { en:"Dog", ta:"நாய்", ro:"naai", img:"🐕", mo:"bounce" }, ... ]);

   Field reference (see README.md → "Adding your own words"):
     en   English word (required)
     ta   Tamil word in Tamil script (required)
     ro   Romanised / how-to-say-it, for grown-ups (required)
     img  picture: an emoji ("🐕") or a drawn sprite ("svg:pomegranate") (required)
     mo   motion/animation name (optional, see css/animations.css)
     say  a short spoken phrase for grown-ups to use with the child (optional)
     note small extra fact shown in "grown-up mode" (optional)
     tag  extra search labels (optional, string or array)
   ========================================================================== */
(function (global) {
  'use strict';

  var TT = global.TT = global.TT || {};
  var TAMIL_RE = /[\u0B80-\u0BFF]/;

  var categories = [];
  var catByKey = Object.create(null);
  var words = [];
  var wordById = Object.create(null);
  var wordsByCat = Object.create(null);
  var dupes = [];

  function slug(str) {
    return String(str).toLowerCase()
      .replace(/[’'`.]/g, '')

  }

  function category(def) {
    if (!def || !def.key) throw new Error('category needs a key');

      key: def.key,
      en: def.en || def.key,
      ta: def.ta || '',
      icon: def.icon || '🔤',
      color: def.color || '#7c3aed',
      color2: def.color2 || null,
      desc: def.desc || '',
      order: (def.order == null ? categories.length : def.order),
      words: []
    };
    categories.push(cat);
    catByKey[cat.key] = cat;
    wordsByCat[cat.key] = cat.words;
    return cat;
  }

  function word(catKey, w) {
    var cat = catByKey[catKey];
    if (!cat) throw new Error('unknown category: ' + catKey);
    if (!w || !w.en || !w.ta || !w.ro || !w.img) {
      throw new Error('word in ' + catKey + ' is missing a field: ' + JSON.stringify(w));
    }
    var item = {
      id: catKey + '/' + slug(w.en),
      cat: catKey,
      catRef: cat,
      en: String(w.en).trim(),
      ta: String(w.ta).trim(),
      ro: String(w.ro).trim(),
      img: String(w.img).trim(),
      mo: w.mo || 'pop',
      say: w.say || null,
      note: w.note || null,
      tag: [].concat(w.tag || [])
    };
    if (wordById[item.id]) { dupes.push(item.id); return wordById[item.id]; }
    words.push(item);
    wordById[item.id] = item;
    cat.words.push(item);

  function wordsFor(catKey, list) {
    for (var i = 0; i < list.length; i++) word(catKey, list[i]);
  }

  /* ---- queries --------------------------------------------------------- */

  function allWords() { return words; }
  function allCategories() { return categories.slice().sort(function (a, b) { return a.order - b.order; }); }
  function getCat(key) { return catByKey[key] || null; }
  function getWord(id) { return wordById[id] || null; }
  function catWords(key) { return wordsByCat[key] || []; }

  function wordsIn(keys) {
    var out = [];

    q = String(q || '').toLowerCase().trim();

<script>
/* ===== js/lib/storage.js ===== */
/* Settings + progress in localStorage, with a tiny migration path. */
(function (TT) {
  'use strict';

  var KEY = 'tamil-tutor.v1';
  var U = TT.util;

  var DEFAULTS = {
    /* what the child sees */
    mode: 'bilingual',            // bilingual | tamil | english
    reveal: 'both',               // both | flip  (flip = picture first, tap to see the word)
    showSay: true,                // show the grown-up phrase chip
    showRoman: true,              // show "naai" under the Tamil word
    /* what the child hears */
    order: 'ta-first',            // ta-first | en-first
    speakTamil: true,
    speakEnglish: true,
    repeats: 2,
    gapMs: 620,
    rate: 0.85, pitch: 1, rateTa: null, pitchTa: null,
    volume: 1, voiceTa: null, voiceEn: null,
    localVoicesOnly: false,        // never use a network voice
    useRecordings: true,          // prefer the human audio pack when it exists
    clipRate: 1,                  // playback speed for recordings
    muted: false,
    sfx: true, sfxVolume: 0.55,
    /* pacing */
    autoplay: false, autoplaySec: 9,
    shuffle: true,
    rewardStars: true,
    /* housekeeping */
    kidLock: false,
    reduceMotion: false,
    theme: 'day',
    lastCategory: null,
    onboarded: false
  };

  var EMPTY_PROGRESS = {
    words: {},           // id -> {seen, correct, wrong, best, first, last}
    stickers: [],        // {wordId, at, cat}
    sessions: 0,
    minutes: 0,
    lastDay: null,
    streak: 0,
    byCat: {}
  };

  var CURRENT_VERSION = 2;

  function blank() {
    return { version: CURRENT_VERSION, settings: Object.assign({}, DEFAULTS), progress: JSON.parse(JSON.stringify(EMPTY_PROGRESS)), custom: [] };
  }

  var memoryOnly = false;
  var persistError = null;
  var recoveredFromBackup = false;
  var lostOnLoad = false;
  var db = blank();

  /* one-time upgrades. Add a step whenever the shape changes, so a save made
     a year ago still opens instead of being quietly thrown away. */
  var MIGRATIONS = {
    2: function (d) {                    // normalise word records (ready for Leitner boxes)
      var words = (d.progress && d.progress.words) || {};
      Object.keys(words).forEach(function (id) {
        var r = words[id] || {};
        words[id] = {
          seen: r.seen || 0, correct: r.correct || 0, wrong: r.wrong || 0,
          best: r.best || 0, first: r.first || 0, last: r.last || 0, box: r.box || 0
        };
      });
      d.progress.words = words;
      return d;
    }
  };

  function migrate(d) {
    for (var v = (d.version || 1) + 1; v <= CURRENT_VERSION; v++) {
      if (MIGRATIONS[v]) { try { d = MIGRATIONS[v](d) || d; } catch (e) { /* keep what we have */ } }
    }
    d.version = CURRENT_VERSION;
    return d;
  }

  function apply(obj) {                  // never trust the shape of stored JSON
    db.settings = Object.assign({}, DEFAULTS, obj.settings || {});
    db.progress = Object.assign(JSON.parse(JSON.stringify(EMPTY_PROGRESS)), obj.progress || {});
    db.progress.words = (obj.progress && obj.progress.words) || {};
    db.progress.stickers = (obj.progress && obj.progress.stickers) || [];
    db.progress.byCat = (obj.progress && obj.progress.byCat) || {};
    db.custom = Array.isArray(obj.custom) ? obj.custom : [];
    db.version = obj.version || 1;
    return migrate(db);
  }

  function readRaw(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function load() {
    var raw = readRaw(KEY);
    if (!raw) return;
    try {
      var obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object') return;
      // keep a last-known-good copy so a half-written save can be recovered
      try { if (readRaw(KEY + '.bak') !== raw) localStorage.setItem(KEY + '.bak', raw); } catch (e) { }
      apply(obj);
    } catch (e) {
      var bak = readRaw(KEY + '.bak');
      if (bak && bak !== raw) {
        try { apply(JSON.parse(bak)); recoveredFromBackup = true; return; } catch (e2) { }
      }
      db = blank();
      lostOnLoad = true;
    }
  }

  var saveSoon = U.debounce(function () {
    if (memoryOnly) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      persistError = null; recoveredFromBackup = false;
    } catch (e) {
      memoryOnly = true;                       // full, private mode, or iOS purge
      persistError = (e && e.name) || String(e);
    }
  }, 350);

  function save() { saveSoon(); }

  /* ------------------------------------------------------------- progress api */

  function wordRec(id) {
    var r = db.progress.words[id];
    if (!r) r = db.progress.words[id] = { seen: 0, correct: 0, wrong: 0, first: 0, last: 0 };
    return r;
  }

  function markSeen(id) {
    var r = wordRec(id);
    r.seen++; r.last = Date.now();
    if (!r.first) r.first = r.last;
    var cat = id.split('/')[0];
    db.progress.byCat[cat] = (db.progress.byCat[cat] || 0) + 1;
    save();
    return r;
  }

  function markAnswer(id, correct) {
    var r = wordRec(id);
    if (correct) { r.correct++; } else { r.wrong++; }
    r.last = Date.now();
    save();
    return r;
  }

  /** 0 = new · 1 = met · 2 = familiar · 3 = mastered */
  function level(id) {
    var r = db.progress.words[id];
    if (!r || !r.seen) return 0;
    if (r.correct >= 4 || (r.correct >= 3 && r.seen >= 8)) return 3;
    if (r.correct >= 1 || r.seen >= 4) return 2;
    return 1;
  }

  var LEVELS = [
    { n: 0, key: 'new', ta: 'புதியது', en: 'New', color: '#9ca3af' },
    { n: 1, key: 'met', ta: 'பழகியது', en: 'Met once', color: '#f59e0b' },
    { n: 2, key: 'familiar', ta: 'நன்கு தெரியும்', en: 'Familiar', color: '#22c55e' },
    { n: 3, key: 'mastered', ta: 'வந்துவிட்டது', en: 'Mastered', color: '#16a34a' }
  ];

  function levelInfo(id) { return LEVELS[level(id)]; }

  function stats() {
    var words = db.progress.words, ids = Object.keys(words), i, id, n = 0;
    var counts = [0, 0, 0, 0];
    var all = TT.data.allWords();
    for (i = 0; i < all.length; i++) { counts[level(all[i].id)]++; }
    n = all.length;
    return {
      total: n,
      seen: counts[1] + counts[2] + counts[3],
      familiar: counts[2] + counts[3],
      mastered: counts[3],
      new: counts[0],
      stickers: db.progress.stickers.length,
      sessions: db.progress.sessions,
      minutes: db.progress.minutes,
      streak: db.progress.streak
    };
  }

  /** Words worth revisiting: mis-tapped, or seen a lot without ever getting one right. */
  function reviewQueue(catKey, limit) {
    var pool = catKey ? TT.data.catWords(catKey) : TT.data.allWords();
    var scored = [];
    pool.forEach(function (w) {
      var r = db.progress.words[w.id];
      if (!r) return;
      var score = 0;
      if (r.wrong >= 1) score += 3 + Math.min(4, r.wrong);
      if (r.seen >= 3 && r.correct === 0) score += 3;
      if (level(w.id) === 0) score -= 5;
      if (score > 0) scored.push({ w: w, s: score });
    });
    scored.sort(function (a, b) { return b.s - a.s; });
    return scored.slice(0, limit || 12).map(function (x) { return x.w; });
  }

  function addSticker(wordId, cat) {
    db.progress.stickers.push({ wordId: wordId, cat: cat, at: Date.now() });
    if (db.progress.stickers.length > 500) db.progress.stickers.shift();
    save();
  }

  function startSession() {
    db.progress.sessions++;
    var t = U.todayKey();
    if (db.progress.lastDay !== t) {
      var y = U.todayKey(new Date(Date.now() - 864e5));
      db.progress.streak = (db.progress.lastDay === y) ? (db.progress.streak + 1) : 1;
      db.progress.lastDay = t;
    }
    save();
  }

  function addMinutes(m) { db.progress.minutes += m; save(); }

  function resetProgress() {
    db.progress = JSON.parse(JSON.stringify(EMPTY_PROGRESS));
    save();
  }

  function resetSettings() { db.settings = Object.assign({}, DEFAULTS); save(); }
  function wipe() {
    db = blank(); memoryOnly = false; persistError = null; lostOnLoad = false;
    try { localStorage.removeItem(KEY + '.bak'); } catch (e) { }
    save();
  }

  /* how well can we actually remember things on this device? */
  function canPersist() { return !memoryOnly; }
  function storageStatus() {
    return {
      persist: !memoryOnly, error: persistError, version: db.version,
      recovered: recoveredFromBackup, lostOnLoad: lostOnLoad,
      words: Object.keys(db.progress.words).length, custom: db.custom.length
    };
  }

  /* ------------------------------------------------------------------ custom */

  function addCustom(def) {
    if (!def || !def.en || !def.ta) return null;
    def.ro = def.ro || def.en;
    def.img = def.img || '🔤';
    def.id = (def.cat || 'custom') + '/' + TT.data.slug(def.en);
    db.custom.push(def);
    save();
    return def;
  }
  function removeCustom(i) { db.custom.splice(i, 1); save(); }
  function updateCustom(i, def) { db.custom[i] = def; save(); }

  TT.store = {
    KEY: KEY,
    DEFAULTS: DEFAULTS,
    LEVELS: LEVELS,
    load: load,
    save: save,
    get settings() { return db.settings; },
    get progress() { return db.progress; },
    get custom() { return db.custom; },
    get persistent() { return !memoryOnly; },
    markSeen: markSeen,
    markAnswer: markAnswer,
    level: level,
    levelInfo: levelInfo,
    stats: stats,
    reviewQueue: reviewQueue,
    addSticker: addSticker,
    startSession: startSession,
    addMinutes: addMinutes,
    resetProgress: resetProgress,
    resetSettings: resetSettings,
    wipe: wipe,
    canPersist: canPersist,
    storageStatus: storageStatus,
    CURRENT_VERSION: CURRENT_VERSION,
    addCustom: addCustom,
    removeCustom: removeCustom,
    updateCustom: updateCustom
  };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/lib/confetti.js ===== */
/* Confetti & star bursts on a single canvas. Respects reduced-motion. */
(function (TT) {
  'use strict';

  var canvas = null, ctx = null, parts = [], raf = null, dpr = 1;
  var COLORS = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#0ea5e9', '#a855f7', '#ec4899', '#14b8a6'];

  function ensure() {
    if (canvas) return true;
    canvas = document.getElementById('fx');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'fx';
      canvas.className = 'fx-canvas';
      document.body.appendChild(canvas);
    }
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize, { passive: true });
    return !!ctx;
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }

  function make(x, y, opts) {
    var a = Math.random() * Math.PI * 2;
    var sp = (opts.speed || 7) * (0.4 + Math.random());
    return {
      x: x, y: y,
      vx: Math.cos(a) * sp * (opts.spread || 1),
      vy: Math.sin(a) * sp - (opts.up || 4),
      g: opts.g == null ? 0.16 : opts.g,
      w: 6 + Math.random() * 9,
      h: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      life: 1,
      decay: 0.006 + Math.random() * 0.008,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      shape: Math.random() < 0.25 ? 'star' : (Math.random() < 0.5 ? 'circle' : 'rect')
    };
  }

  function loop() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      if (p.life <= 0 || p.y > window.innerHeight + 60) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x * dpr, p.y * dpr);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(0, 0, p.w * 0.5 * dpr, 0, 6.3); ctx.fill();
      } else if (p.shape === 'star') {
        ctx.beginPath();
        for (var k = 0; k < 5; k++) {
          var a1 = (k * 2 * Math.PI) / 5 - Math.PI / 2, a2 = a1 + Math.PI / 5;
          ctx.lineTo(Math.cos(a1) * p.w * dpr, Math.sin(a1) * p.w * dpr);
          ctx.lineTo(Math.cos(a2) * p.w * 0.45 * dpr, Math.sin(a2) * p.w * 0.45 * dpr);
        }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillRect(-p.w * 0.5 * dpr, -p.h * 0.5 * dpr, p.w * dpr, p.h * dpr);
      }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  function start() { if (!raf) raf = requestAnimationFrame(loop); }

  function burst(x, y, opts) {
    if (TT.store && TT.store.settings.reduceMotion) return;
    if (TT.util.prefersReducedMotion() && !(opts && opts.force)) return;
    if (!ensure()) return;
    opts = opts || {};
    var n = opts.count || 42;
    for (var i = 0; i < n; i++) parts.push(make(x, y, opts));
    if (parts.length > 700) parts.splice(0, parts.length - 700);
    start();
  }

  function rain(opts) {
    opts = opts || {};
    if (TT.store && TT.store.settings.reduceMotion) return;
    if (!ensure()) return;
    var w = window.innerWidth;
    for (var i = 0; i < (opts.count || 60); i++) {
      var p = make(Math.random() * w, -20 - Math.random() * 300, { g: 0.08, speed: 2, up: -1 });
      p.decay = 0.0035;
      parts.push(p);
    }
    start();
  }

  /** Celebrate at the centre of an element. */
  function atEl(node, opts) {
    var r = node.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, opts);
  }

  TT.confetti = { burst: burst, rain: rain, atEl: atEl, clear: function () { parts = []; if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); } };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/ui.js ===== */
/* Shared building blocks: cards, tiles, sheets, toasts. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data;

  /* --------------------------------------------------------------- pictures */

  function pictureHTML(word, cls) {
    var svg = TT.spriteFor(word.img);
    var inner = svg;
    if (!inner) {
      var n = Math.max(1, Math.min(10, word.q || 1));
      var bits = [];
      for (var i = 0; i < n; i++) bits.push('<span class="emoji">' + U.esc(word.img) + '</span>');
      inner = n > 1 ? '<span class="emoji-grid n-' + n + '">' + bits.join('') + '</span>' : bits[0];
    }
    var sym = word.sym ? '<span class="sym-badge">' + U.esc(word.sym) + '</span>' : '';
    return '<span class="pic mo-' + U.esc(word.mo || 'pop') + ' ' + (cls || '') + '">' + sym + inner + '</span>';
  }

  /* ------------------------------------------------------------------ cards */

  /**
   * The flash card. opts:
   *   size      'big' (one at a time) | 'tile'
   *   flip      show Tamil side only after a tap
   *   speak     speak on tap (default true)
   *   onTap     extra tap handler
   *   showSay   show the grown-up phrase chip
   */
  function cardEl(word, opts) {
    opts = opts || {};
    var s = TT.store.settings;
    var mode = opts.mode || s.mode || 'bilingual';
    var flip = opts.flip != null ? opts.flip : (s.reveal === 'flip' && opts.size === 'big');

    var words = document.createElement('div');
    words.className = 'card-words';
    if (mode !== 'english') {
      U.append(words, U.el('div.w-ta.tamil', { text: word.ta }));
      if (s.showRoman !== false) U.append(words, U.el('div.w-ro', { text: word.ro }));
    }
    if (mode !== 'tamil') U.append(words, U.el('div.w-en', { text: word.en }));
    if (opts.showSay !== false && s.showSay !== false && word.say && opts.size === 'big') {
      var say = U.el('button.chip.chip-say', { type: 'button', title: 'Hear the grown-up sentence' }, [
        U.el('span.chip-ico', { text: '💬' }), U.el('span.tamil', { text: word.say })
      ]);
      say.addEventListener('click', function (e) {
        e.stopPropagation();
        A.unlock(); A.cancel(); A.speakSentence(word);
        A.sfx('ding');
      });
      U.append(words, say);
    }

    var front = U.el('div.face.front', {}, [U.el('div.card-stage', {}, U.el('div.card-pic', { html: pictureHTML(word) }))]);
    var card;

    if (flip) {
      var back = U.el('div.face.back', {}, [
        U.el('div.card-stage', {}, [
          U.el('div.flip-words', {}, [
            mode !== 'english' ? U.el('div.w-ta.tamil.big-ta', { text: word.ta }) : null,
            s.showRoman !== false && mode !== 'english' ? U.el('div.w-ro', { text: word.ro }) : null,
            mode !== 'tamil' ? U.el('div.w-en' + (mode === 'english' ? ' tamil big-ta' : ''), { text: word.en }) : null
          ])
        ])
      ]);
      card = U.el('article.card.card-flip' + (opts.size === 'big' ? ' card-big' : ' card-tile'), {
        dataset: { id: word.id, cat: word.cat, side: 'front' }, tabindex: '0', role: 'button',
        'aria-label': word.en + ' — ' + word.ta
      }, [front, back]);
    } else {
      var body = U.el('div.card-body', {}, [
        U.el('div.card-stage', {}, U.el('div.card-pic', { html: pictureHTML(word) })),
        words
      ]);
      card = U.el('article.card' + (opts.size === 'big' ? ' card-big' : ' card-tile'), {
        dataset: { id: word.id, cat: word.cat }, tabindex: '0', role: 'button',
        'aria-label': word.en + ' — ' + word.ta
      }, body);
    }

    var lvl = TT.store.level(word.id);
    if (lvl > 0) U.append(card, U.el('span.level-dot', { dataset: { lvl: String(lvl) }, title: TT.store.LEVELS[lvl].en }));

    function tap(e) {
      if (e) e.preventDefault();
      A.unlock();
      TT.store.markSeen(word.id);
      if (flip) {
        var now = card.dataset.side === 'front' ? 'back' : 'front';
        card.dataset.side = now;
        A.sfx('flip');
      }
      if (opts.speak !== false) {
        A.cancel();
        A.sayWord(word, { onend: function () { if (opts.onEnd) opts.onEnd(); } });
      }
      if (opts.speak !== false) A.sfx(word.cat === 'animals' || word.cat === 'birds' || word.cat === 'bugs' || word.cat === 'sea' ? 'animal' : 'pop');
      U.haptic(14);
      card.classList.remove('tapped');
      void card.offsetWidth;
      card.classList.add('tapped');
      if (opts.onTap) opts.onTap(word, card);
    }
    card.addEventListener('click', tap);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(e); }
    });
    return card;
  }

  /** Small square button that speaks a word — used in the sticker book & grids. */
  function miniCard(word, onClick) {
    var m = TT.store.settings.mode;
    var node = U.el('button.mini', { type: 'button', dataset: { id: word.id }, 'aria-label': word.en }, [
      U.el('span.mini-pic', { html: pictureHTML(word) }),
      m !== 'english' ? U.el('span.mini-ta.tamil', { text: word.ta }) : null,
      m !== 'tamil' ? U.el('span.mini-en', { text: word.en }) : null
    ]);
    node.addEventListener('click', function () {
      A.unlock(); A.cancel(); A.sfx('pop'); A.sayWord(word);
      TT.store.markSeen(word.id);
      U.haptic(10);
      if (onClick) onClick(word, node);
    });
    return node;
  }

  /* ------------------------------------------------------------------ tiles */

  function catTile(cat, href, opts) {
    opts = opts || {};
    var total = cat.words.length;
    var seen = 0;
    cat.words.forEach(function (w) { if (TT.store.level(w.id) > 0) seen++; });
    var pct = total ? Math.round((seen / total) * 100) : 0;
    var node = U.el('a.tile', {
      href: href, dataset: { cat: cat.key },
      style: '--cat:' + cat.color + ';--cat2:' + (cat.color2 || shade(cat.color, 18)),
      'aria-label': cat.en + ' ' + cat.ta
    }, [
      U.el('span.tile-icon', { text: cat.icon }),
      U.el('span.tile-ta.tamil', { text: cat.ta }),
      U.el('span.tile-en', { text: cat.en }),
      U.el('span.tile-count', { text: total + ' words' }),
      U.el('span.tile-bar', {}, U.el('span.tile-bar-fill', { style: 'width:' + pct + '%' }))
    ]);
    node.addEventListener('click', function () { A.unlock(); A.sfx('tap'); });
    return node;
  }

  function shade(hex, amt) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return hex;
    var r = Math.min(255, parseInt(m[1], 16) + amt), g = Math.min(255, parseInt(m[2], 16) + amt), b = Math.min(255, parseInt(m[3], 16) + amt);
    return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  }

  /* ----------------------------------------------------------------- chrome */

  function bigButton(label, opts, onclick) {
    opts = opts || {};
    var b = U.el('button.big-btn', {
      type: 'button',
      style: opts.color ? '--cat:' + opts.color : null,
      'aria-label': opts.aria || label
    }, [
      opts.icon ? U.el('span.big-btn-ico', { text: opts.icon }) : null,
      U.el('span.big-btn-label', {}, [
        U.el('span', { text: label }),
        opts.ta ? U.el('span.tamil.big-btn-ta', { text: opts.ta }) : null
      ]),
      opts.sub ? U.el('span.big-btn-sub', { text: opts.sub }) : null
    ]);
    b.addEventListener('click', function () { A.unlock(); A.sfx('tap'); onclick && onclick(); });
    return b;
  }

  var scrimCount = 0;
  function sheet(title, contentNode, opts) {
    opts = opts || {};
    var root = document.getElementById('sheet-root');
    var scrim = U.el('div.scrim');
    var box = U.el('div.sheet', { role: 'dialog', 'aria-modal': 'true', 'aria-label': title, tabindex: '-1' });
    var head = U.el('header.sheet-head', {}, [
      U.el('h2.sheet-title', { text: title }),
      U.el('button.icon-btn.sheet-close', { type: 'button', 'aria-label': 'Close', text: '✕' })
    ]);
    head.querySelector('.sheet-close').addEventListener('click', close);
    U.append(box, [head, U.el('div.sheet-body', {}, contentNode)]);
    if (opts.footer) U.append(box, U.el('footer.sheet-foot', {}, opts.footer));
    U.append(root, [scrim, box]);
    requestAnimationFrame(function () { scrim.classList.add('in'); box.classList.add('in'); });
    scrimCount++;
    document.body.classList.add('sheet-open');
    head.querySelector('.sheet-close').focus();

    function close() {
      if (!scrim.parentNode) return;
      scrim.classList.remove('in'); box.classList.remove('in');
      setTimeout(function () {
        if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
        if (box.parentNode) box.parentNode.removeChild(box);
      }, 180);
      scrimCount--;
      if (scrimCount <= 0) document.body.classList.remove('sheet-open');
      if (opts.onClose) opts.onClose();
    }
    scrim.addEventListener('click', close);
    box.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    return { close: close, node: box };
  }

  var toastTimer;
  function toast(msg, opts) {
    opts = opts || {};
    var t = document.getElementById('toast');
    if (!t) { t = U.el('div#toast.toast', { role: 'status', 'aria-live': 'polite' }); document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('in');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('in'); }, opts.ms || 1800);
  }

  function sectionHead(ta, en, extra) {
    return U.el('div.section-head', {}, [
      U.el('h2.section-ta.tamil', { text: ta }),
      U.el('p.section-en', { text: en }),
      extra || null
    ]);
  }

  function empty(msg) { return U.el('p.empty', { text: msg || 'Nothing here yet — play a little!' }); }

  TT.ui = {
    pictureHTML: pictureHTML,
    cardEl: cardEl,
    miniCard: miniCard,
    catTile: catTile,
    bigButton: bigButton,
    sheet: sheet,
    toast: toast,
    sectionHead: sectionHead,
    empty: empty,
    shade: shade
  };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/app.js ===== */
/* App shell: boot, hash router, home, category page, search. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data, S = TT.store, UI = TT.ui;

  var views = TT.views = {};
  var current = null;

  /* --------------------------------------------------------------- routing */

  function parseHash() {
    var h = (location.hash || '#/').replace(/^#\/?/, '');
    var segs = h.split('/').filter(Boolean);
    return { name: segs[0] || 'home', a: segs[1] || null, b: segs[2] || null };
  }

  function go(path) {
    if (path.charAt(0) !== '#') path = '#/' + path.replace(/^\/+/, '');
    if (location.hash === path) render(); else location.hash = path;
  }

  function render() {
    var route = parseHash();
    var view = views[route.name] || views.home;
    var host = document.getElementById('view');

    if (current && current.onLeave) { try { current.onLeave(); } catch (e) { /* noop */ } }
    A.cancel();
    U.clear(host);
    host.scrollTop = 0;
    window.scrollTo(0, 0);
    document.body.dataset.view = route.name;

    current = view;
    try {
      view.render(host, route);
    } catch (err) {
      console.error('view failed', err);
      U.append(host, U.el('p.empty', { text: 'Oops — that page had a problem. Tap home to start again.' }));
    }
    document.getElementById('btn-back').hidden = (route.name === 'home');
    updateStars();
    highlightNav(route.name);
  }

  function highlightNav(name) {
    U.qsa('.tabbar .tab').forEach(function (t) {
      t.classList.toggle('on', t.dataset.route === name || (name === 'cat' && t.dataset.route === 'learn'));
    });
  }

  /* ---------------------------------------------------------------- chrome */

  function updateStars() {
    var n = S.progress.stickers.length;
    var el = document.getElementById('star-count');
    if (el) el.textContent = n;
  }

  function buildChrome() {
    var body = document.body;

    var bg = U.el('div#bg.bg', { 'aria-hidden': 'true' });
    var shapes = ['🌿', '⭐', '🌸', '🐘', '☁️', '🪁', '🌙', '🍋', '🦋', '🎈'];
    for (var i = 0; i < shapes.length; i++) {
      var s = U.el('span.bg-shape', { text: shapes[i], style: 'left:' + (i * 9.7 + 2) + '%;font-size:' + (26 + (i % 4) * 16) + 'px;animation-duration:' + (26 + (i % 5) * 9) + 's;animation-delay:-' + (i * 3.3) + 's;opacity:' + (0.10 + (i % 3) * 0.05) });
      bg.appendChild(s);
    }
    U.append(body, bg);

    var backBtn = U.el('button#btn-back.icon-btn.nav-back', { type: 'button', 'aria-label': 'Back', hidden: true, text: '←' });
    backBtn.addEventListener('click', function () { A.sfx('tap'); history.length > 1 ? history.back() : go('home'); });

    var brand = U.el('button.brand', { type: 'button', 'aria-label': 'Tamil Tutor home' }, [
      U.el('span.brand-ico', { text: '🐘' }),
      U.el('span.brand-text', {}, [
        U.el('span.brand-ta.tamil', { text: 'தமிழ்' }),
        U.el('span.brand-en', { text: 'Tutor' })
      ])
    ]);
    brand.addEventListener('click', function () { A.unlock(); A.sfx('ding'); go('home'); });
    /* hidden grown-up entrance: press and hold the elephant for 3 seconds */
    var holdTimer = null, holdRing = null;
    function startHold() {
      if (!S.settings.kidLock) return;
      holdRing = U.el('span.hold-ring');
      brand.appendChild(holdRing);
      holdTimer = setTimeout(function () {
        if (holdRing) { holdRing.remove(); holdRing = null; }
        A.sfx('correct'); go('grownup');
      }, 3000);
    }
    function endHold() { clearTimeout(holdTimer); if (holdRing) { holdRing.remove(); holdRing = null; } }
    brand.addEventListener('pointerdown', startHold);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) { brand.addEventListener(t, endHold); });

    var starBtn = U.el('button.icon-btn.star-btn', { type: 'button', 'aria-label': 'My stars' }, [
      U.el('span', { text: '⭐' }), U.el('span#star-count.badge', { text: '0' })
    ]);
    starBtn.addEventListener('click', function () { A.sfx('tap'); go('stickers'); });

    var soundBtn = U.el('button.icon-btn.sound-btn', { type: 'button', 'aria-label': 'Sound on/off' });
    function paintSound() {
      soundBtn.textContent = (S.settings.muted || S.settings.sfx === false) ? '🔇' : '🔊';
      soundBtn.setAttribute('aria-pressed', String(!(S.settings.muted || S.settings.sfx === false)));
    }
    soundBtn.addEventListener('click', function () {
      S.settings.muted = !S.settings.muted;
      S.save(); paintSound();
      if (!S.settings.muted) { A.unlock(); A.sfx('ding'); } else A.cancel();
    });
    paintSound();
    TT.repaintSound = paintSound;

    var parentBtn = U.el('button.icon-btn.parent-btn', { type: 'button', 'aria-label': 'Grown-ups' }, [U.el('span', { text: '🧩' })]);
    parentBtn.addEventListener('click', function () { A.sfx('tap'); go('grownup'); });
    function paintKidLock() { parentBtn.hidden = !!S.settings.kidLock; }
    paintKidLock();
    TT.repaintKidLock = paintKidLock;

    U.append(body, [
      U.el('header.topbar', {}, [
        backBtn, brand,
        U.el('div.topbar-actions', {}, [starBtn, soundBtn, parentBtn])
      ])
    ]);

    var tabs = [
      { route: 'home', icon: '🏠', ta: 'முகப்பு', en: 'Home' },
      { route: 'learn', icon: '📚', ta: 'கற்க', en: 'Learn' },
      { route: 'play', icon: '🎲', ta: 'விளையாடு', en: 'Play' },
      { route: 'stickers', icon: '⭐', ta: 'நட்சத்திரம்', en: 'Stars' }
    ];
    var tabbar = U.el('nav.tabbar', { role: 'navigation', 'aria-label': 'Main' });
    tabs.forEach(function (t) {
      var b = U.el('button.tab', { type: 'button', dataset: { route: t.route }, 'aria-label': t.en }, [
        U.el('span.tab-ico', { text: t.icon }),
        U.el('span.tab-ta.tamil', { text: t.ta }),
        U.el('span.tab-en', { text: t.en })
      ]);
      b.addEventListener('click', function () { A.unlock(); A.sfx('tap'); go(t.route); });
      tabbar.appendChild(b);
    });
    U.append(body, tabbar);
    U.append(body, U.el('div#sheet-root'));
    U.append(body, U.el('canvas#fx.fx-canvas', { 'aria-hidden': 'true' }));
  }

  /* ------------------------------------------------------------------ home */

  views.home = {
    render: function (host, route) {
      var cats = D.allCategories();
      var st = S.stats();

      var hello = U.el('section.hero', {}, [
        U.el('div.hero-mascot', { 'aria-hidden': 'true' }, [U.el('span.hero-elephant', { text: '🐘' })]),
        U.el('div.hero-text', {}, [
          U.el('h1.hero-ta.tamil', { text: 'வணக்கம்!' }),
          U.el('p.hero-en', {}, ['Hello little one — ', U.el('b', { text: 'let’s learn Tamil!' })]),
          U.el('p.hero-stats', {}, [
            U.el('span.stat-pill', { text: '⭐ ' + st.stickers }),
            U.el('span.stat-pill', { text: '👀 ' + st.seen + '/' + st.total }),
            U.el('span.stat-pill', { text: '🔒 ' + st.mastered + ' mastered' })
          ])
        ])
      ]);
      hello.querySelector('.hero-mascot').addEventListener('click', function () {
        A.unlock(); A.cancel(); A.sfx('applause'); A.speakText('வணக்கம்! நாம் தமிழ் படிப்போமா. வாங்க!', { lang: 'ta', roman: 'Vanakkam! Naam Tamil padippoma. Vaanga!' });
        TT.confetti.atEl(hello, { count: 26 });
      });
      host.appendChild(hello);

      /* keep going */
      var last = S.settings.lastCategory && D.getCat(S.settings.lastCategory) ? D.getCat(S.settings.lastCategory) : null;
      if (last) {
        host.appendChild(U.el('section.row', {}, [
          UI.sectionHead('தொடரலாம்', 'Pick up where you left off'),
          U.el('div.row-cta', {}, [
            UI.bigButton('Continue ' + last.en, { icon: last.icon, ta: last.ta, color: last.color, sub: last.words.length + ' words' }, function () { go('cards/' + last.key); }),
            UI.bigButton('Play a game', { icon: '🎲', ta: 'விளையாடு', color: '#7c3aed' }, function () { go('play/' + last.key); })
          ])
        ]));
      }

      /* five brand new words to meet today */
      var fresh = [];
      var pool = D.allWords();
      var shuffled = D.shuffle(pool);
      for (var i = 0; i < shuffled.length && fresh.length < 5; i++) {
        if (S.level(shuffled[i].id) === 0 && (!last || shuffled[i].cat === last.key || fresh.length > 2)) fresh.push(shuffled[i]);
      }
      if (!fresh.length) fresh = D.shuffle(pool).slice(0, 5);
      host.appendChild(U.el('section.row', {}, [
        UI.sectionHead('இன்னைக்கு புதிய சொல்', 'New words for today'),
        U.el('div.mini-row', {}, fresh.map(function (w) { return UI.miniCard(w); }))
      ]));

      /* review what needs practice */
      var review = S.reviewQueue(null, 5);
      if (review.length) {
        host.appendChild(U.el('section.row', {}, [
          UI.sectionHead('மீண்டு பாப்போம்', 'Worth another look'),
          U.el('div.mini-row', {}, review.map(function (w) { return UI.miniCard(w); }))
        ]));
      }

      /* all the categories */
      host.appendChild(U.el('section.row', {}, [
        UI.sectionHead('என்ன படிப்போம்?', 'Choose a topic', (function () {
          var b = U.el('button.chip', { type: 'button' }, [U.el('span.chip-ico', { text: '🔎' }), U.el('span', { text: 'Search' })]);
          b.addEventListener('click', function () { go('search'); });
          return b;
        })()),
        U.el('div.tile-grid', {}, cats.map(function (c) { return UI.catTile(c, '#/cat/' + c.key); }))
      ]));

      var foot = U.el('p.foot-note', {}, [
        'Made for little hands · works offline · no ads, no tracking. ',
        U.el('button.linkish', { type: 'button', text: 'Grown-up corner' })
      ]);
      foot.querySelector('.linkish').addEventListener('click', function () { go('grownup'); });
      host.appendChild(foot);
    }
  };

  /* --------------------------------------------------------- learn (picker) */

  views.learn = {
    render: function (host) {
      host.appendChild(UI.sectionHead('படிக்கலாம்', 'Choose a topic to start flashcards'));
      var wrap = U.el('div.tile-grid', {});
      D.allCategories().forEach(function (c) { wrap.appendChild(UI.catTile(c, '#/cat/' + c.key)); });
      host.appendChild(wrap);
    }
  };

  views.play = {
    render: function (host, route) {
      host.appendChild(UI.sectionHead('விளையாடு', 'Games — pick a topic'));
      var cats = D.allCategories();
      var wrap = U.el('div.tile-grid', {});
      cats.forEach(function (c) {
        var a = UI.catTile(c, '#/play/' + c.key);
        a.classList.add('tile-game');
        wrap.appendChild(a);
      });
      host.appendChild(wrap);
    }
  };

  /* ------------------------------------------------------- category landing */

  views.cat = {
    render: function (host, route) {
      var cat = D.getCat(route.a);
      if (!cat) { go('learn'); return; }
      S.settings.lastCategory = cat.key; S.save();

      var head = U.el('section.cat-head', { style: '--cat:' + cat.color }, [
        U.el('div.cat-icon', { text: cat.icon }),
        U.el('div.cat-title', {}, [
          U.el('h1.tamil', { text: cat.ta }),
          U.el('p.cat-en', { text: cat.en }),
          U.el('p.cat-desc', { text: cat.desc })
        ])
      ]);
      head.querySelector('.cat-icon').addEventListener('click', function () {
        A.unlock(); A.cancel(); A.speakText(cat.ta, { lang: 'ta' }); A.sfx('ding');
        TT.confetti.atEl(head, { count: 18 });
      });
      host.appendChild(head);

      var seen = cat.words.filter(function (w) { return S.level(w.id) > 0; }).length;
      host.appendChild(U.el('div.cat-cta', {}, [
        UI.bigButton('Flashcards', { icon: '🃏', ta: 'சொல் அட்டை', color: cat.color, sub: cat.words.length + ' words' }, function () { go('cards/' + cat.key); }),
        UI.bigButton('Games', { icon: '🎲', ta: 'விளையாட்டு', color: cat.color, sub: '3 games' }, function () { go('play/' + cat.key); }),
        UI.bigButton('Say them all', { icon: '🗣️', ta: 'பட்டியல்', color: cat.color, sub: seen + ' met' }, function () { go('wall/' + cat.key); })
      ]));

      host.appendChild(UI.sectionHead('அனைத்து சொற்கள்', 'All the words — tap to hear them'));
      var wall = U.el('div.mini-grid', {});
      cat.words.forEach(function (w) { wall.appendChild(UI.miniCard(w)); });
      host.appendChild(wall);
    }
  };

  views.wall = {
    render: function (host, route) {
      var cat = D.getCat(route.a);
      if (!cat) { go('learn'); return; }
      host.appendChild(UI.sectionHead(cat.ta, cat.en + ' — tap any picture to hear it'));
      var wall = U.el('div.mini-grid', {});
      cat.words.forEach(function (w) { wall.appendChild(UI.miniCard(w)); });
      host.appendChild(wall);
    }
  };

  /* ---------------------------------------------------------------- search */

  views.search = {
    render: function (host) {
      host.appendChild(UI.sectionHead('தேடு', 'Search in Tamil, English or how it sounds'));
      var input = U.el('input.search-input', { type: 'search', placeholder: 'dog, நாய், naai…', 'aria-label': 'Search words', autocomplete: 'off' });
      var out = U.el('div.mini-grid', {});
      host.appendChild(input); host.appendChild(out);
      setTimeout(function () { input.focus(); }, 60);

      function run() {
        var q = input.value.trim();
        var res = q ? D.search(q).slice(0, 60) : D.shuffle(D.allWords()).slice(0, 24);
        U.clear(out);
        if (!res.length) { U.append(out, UI.empty('No words found — try another spelling')); return; }
        res.forEach(function (w) { out.appendChild(UI.miniCard(w)); });
      }
      input.addEventListener('input', U.debounce(run, 160));
      run();
    }
  };

  /* ------------------------------------------------------------------ boot */

  function applyTheme() {
    document.documentElement.dataset.theme = S.settings.theme || 'day';
    document.documentElement.dataset.motion = S.settings.reduceMotion ? 'reduced' : 'full';
  }

  function registerCustomWords() {
    if (!S.custom.length) return;
    if (!D.getCat('custom')) {
      D.category({ key: 'custom', en: 'My words', ta: 'நம்ம சொற்கள்', icon: '🏡', color: '#0f766e', desc: 'Added by you' });
    }
    S.custom.forEach(function (w) {
      var key = w.cat && D.getCat(w.cat) ? w.cat : 'custom';
      D.words(key, [{ en: w.en, ta: w.ta, ro: w.ro, img: w.img, mo: w.mo, say: w.say }]);
    });
  }

  /* ------------------------------------------------ new version / save health */

  var updateBar = null;
  var reloading = false;

  function offerUpdate(worker) {                 // a refreshed worker is installed, waiting
    if (!worker || updateBar || reloading) return;
    var later, go;
    updateBar = U.el('div.update-bar', { role: 'status', 'aria-live': 'polite' }, [
      U.el('span.update-bar-text', { text: '🆕 New version ready' }),
      go = U.el('button.btn.btn-small', { text: 'Refresh', onclick: function () {
        try { worker.postMessage({ type: 'SKIP_WAITING' }); }
        catch (e) { location.reload(); }
      } }),
      later = U.el('button.btn.btn-ghost.btn-small', { text: 'Later', onclick: function () {
        if (updateBar) { updateBar.remove(); updateBar = null; }
      } })
    ]);
    document.body.appendChild(updateBar);
    return updateBar;
  }

  function watchForUpdates(reg) {
    if (reg.waiting) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function () {
        var st = nw.state || nw.status;
        if (st === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
      });
    });
    var ping = function () { try { reg.update(); } catch (e) { } };
    ping();
    document.addEventListener('visibilitychange', function () { if (!document.hidden) ping(); });
  }

  function storageNotice() {
    var st = S.storageStatus ? S.storageStatus() : { persist: true };
    if (!st.persist) {
      if (A && A.sfx) { /* nothing to play yet — first gesture hasn't happened */ }
      setTimeout(function () {
        if (TT.ui && TT.ui.toast) TT.ui.toast('⚠️ Progress cannot be saved here — use Data → Export', { ms: 4200 });
      }, 900);
    } else if (st.recovered || st.lostOnLoad) {
      setTimeout(function () {

/* ===== js/views/learn.js ===== */
/* Flashcards: one big card at a time, swipe or tap the arrows, spoken aloud. */
(function (TT) {

      if (!deck.length) { U.append(host, UI.empty('No words here yet')); return; }

      S.settings.lastCategory = cat ? cat.key : null; S.save();
      var color = cat ? cat.color : '#7c3aed';
      var i = 0, starsThisRun = 0, autoplayTimer = null, done = false;

      var bar = U.el('div.deck-bar', {}, [
        U.el('button.icon-btn', { type: 'button', 'aria-label': 'Back to topic', text: '☰' }),

      var stage = U.el('div.deck-stage', { style: '--cat:' + color });
      var ring = U.el('div.autoplay-ring', { 'aria-hidden': 'true' });

      var nav = U.el('div.deck-nav', {}, [
        U.el('button.nav-arrow.prev', { type: 'button', 'aria-label': 'Previous word' }, [U.el('span', { text: '◀' })]),
        U.el('button.nav-hint', { type: 'button', 'aria-label': 'Tap the card to hear the word' }, [U.el('span', { text: '👆' }), U.el('small', { text: 'tap the picture' })]),
        U.el('button.nav-arrow.next', { type: 'button', 'aria-label': 'Next word' }, [U.el('span', { text: '▶' })])

      nav.querySelector('.nav-hint').addEventListener('click', function () { A.cancel(); A.sayWord(deck[i]); });

      U.append(host, [bar, stage, nav]);

      function paint() {
        var w = deck[i];

        bar.querySelector('.deck-progress-fill').style.width = Math.round(((i + 1) / deck.length) * 100) + '%';

          U.el('div.done-emoji', { text: '🎉' }),

            UI.bigButton('Games', { icon: '🎲', color: '#7c3aed' }, function () { go('play/' + (cat ? cat.key : 'all')); }),
            UI.bigButton('Topics', { icon: '📚', color: '#0ea5e9' }, function () { go('learn'); })

        U.clear(nav);
        A.sfx('applause');
        A.speakText('அருமை! ரொம்ப நல்லா படிக்கிற.', { lang: 'ta', roman: 'Arumai! Romba nalla padikkira.' });
        TT.confetti.rain({ count: 70 });
      }

      function renderNav() {
        U.clear(nav);
        var p = U.el('button.nav-arrow.prev', { type: 'button', 'aria-label': 'Previous word' }, [U.el('span', { text: '◀' })]);
        var h = U.el('button.nav-hint', { type: 'button' }, [U.el('span', { text: '👆' }), U.el('small', { text: 'tap the picture' })]);
        var nx = U.el('button.nav-arrow.next', { type: 'button', 'aria-label': 'Next word' }, [U.el('span', { text: '▶' })]);
        p.addEventListener('click', function () { step(-1); });
        nx.addEventListener('click', function () { step(1); });

        U.append(nav, [p, h, nx]);

      /* ---- star every 5 cards ---- */
      var seenInRun = 0;

          TT.confetti.burst(window.innerWidth / 2, window.innerHeight * 0.42, { count: 30 });

<script>
/* ===== js/views/games.js ===== */
/* Four games: Listen & Pick, Peek-a-boo, Find-them-all, Say it in English. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data, S = TT.store, UI = TT.ui;
  var views = TT.views;

  var praise = ['சூப்பர்!', 'அருமை!', 'ரொம்ப நல்லா!', 'மெல்ல மெல்ல!', 'ஆமா, அதுதான்!'];

  function sayPraise() {
    var p = U.pickOne(praise);
    A.speakText(p, { lang: 'ta', roman: 'Super!' });
  }

  function gameHeader(title, cat) {
    return U.el('div.game-head', { style: cat ? '--cat:' + cat.color : null }, [
      U.el('button.icon-btn', { type: 'button', 'aria-label': 'Back to games', text: '←' }),
      U.el('h1.game-title', {}, [U.el('span.game-title-en', { text: title }), cat ? U.el('span.game-title-ta.tamil', { text: cat.ta }) : null]),
      U.el('div.game-score', { text: '⭐ 0' })
    ]);
  }

  /* ------------------------------------------------------- topic → game menu */

  views.play = {
    render: function (host, route) {
      if (!route.a) return renderTopics(host);
      var cat = D.getCat(route.a);
      if (!cat) return renderTopics(host);
      if (route.b) return runGame(host, route.b, cat);

      S.settings.lastCategory = cat.key; S.save();
      host.appendChild(UI.sectionHead(cat.ta + ' — விளையாடு', cat.en + ' — choose a game'));
      var wrap = U.el('div.game-menu', {});
      [
        { g: 'listen', icon: '👂', ta: 'கேட்டு சொடுக்கு', en: 'Listen & pick', sub: 'Hear the word, tap the picture' },
        { g: 'peek', icon: '🙈', ta: 'மறைச்சிருக்கு', en: 'Peek-a-boo', sub: 'Lift the leaf, find the word' },
        { g: 'find', icon: '🔎', ta: 'எல்லாம் தேடு', en: 'Find them all', sub: 'Tap every picture from this topic' },
        { g: 'english', icon: '🔤', ta: 'ஆங்கிலத்தில் சொல்', en: 'Say it in English', sub: 'Hear the Tamil, say the English word' }
      ].forEach(function (x) {
        wrap.appendChild(UI.bigButton(x.en, { icon: x.icon, ta: x.ta, sub: x.sub, color: cat.color }, function () {
          TT.app.go('play/' + cat.key + '/' + x.g);
        }));
      });
      host.appendChild(wrap);

      if (S.reviewQueue(cat.key, 3).length) {
        host.appendChild(U.el('div.game-menu', {}, [
          UI.bigButton('Practice these', { icon: '🔁', ta: 'மீண்டும்', sub: 'Words that need help', color: '#e11d48' }, function () {
            TT.app.go('play/' + cat.key + '/review');
          })
        ]));
      }
    }
  };

  function renderTopics(host) {
    host.appendChild(UI.sectionHead('எந்த(topic) விளையாடுவோம்?', 'Which topic should we play with?'));
    var wrap = U.el('div.tile-grid', {});
    D.allCategories().forEach(function (c) {
      var t = UI.catTile(c, '#/play/' + c.key);
      t.classList.add('tile-game');
      wrap.appendChild(t);
    });
    host.appendChild(wrap);
  }

  function runGame(host, name, cat) {
    var f = games[name] || games.listen;
    f(host, cat);
  }

  var games = {};

  /* ------------------------------------------------------- 1 · Listen & Pick */

  games.listen = function (host, cat) {
    var pool = cat ? D.catWords(cat.key) : D.allWords();
    if (pool.length < 2) pool = D.allWords();
    var score = 0, streak = 0, round = 0, ROUNDS = 8, locked = false, current = null, cleanup = [];

    var head = gameHeader('Listen & pick', cat);
    var scoreEl = head.querySelector('.game-score');
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go('play/' + (cat ? cat.key : '')); });
    host.appendChild(head);

    var promptBar = U.el('div.game-prompt', {}, [
      U.el('button.replay-btn', { type: 'button', 'aria-label': 'Say it again' }, [U.el('span', { text: '🔊' })]),
      U.el('p.game-instruction', {}, [U.el('span.tamil', { text: 'கேளு…' }), U.el('span', { text: ' which one did you hear?' })])
    ]);

    var board = U.el('div.game-board', {});
    host.appendChild(board);

    promptBar.querySelector('.replay-btn').addEventListener('click', function () {
      if (!current) return;
      A.cancel(); A.sayWord(current);
      this.classList.remove('pulse'); void this.offsetWidth; this.classList.add('pulse');
    });

    function nextRound() {
      round++;
      if (round > ROUNDS) return endGame();
      locked = false;

      /* bias towards words the child hasn't mastered */
      var weighted = pool.map(function (w) {
        var l = S.level(w.id);
        return { w: w, s: (l === 0 ? 5 : l === 1 ? 4 : l === 2 ? 2 : 1) + Math.random() * 3 };
      }).sort(function (a, b) { return b.s - a.s; });
      current = weighted[0].w;

      var n = U.clamp(2 + Math.floor(streak / 3), 2, 4);
      var opts = [current];
      var others = D.shuffle(pool).filter(function (w) { return w.id !== current.id; });
      for (var i = 0; i < others.length && opts.length < n; i++) {
        if (!opts.some(function (o) { return o.img === others[i].img; })) opts.push(others[i]);
      }
      opts = D.shuffle(opts);

      U.clear(board);
      board.className = 'game-board n' + opts.length;
      var cards = {};
      opts.forEach(function (w) {
        var c = UI.cardEl(w, { size: 'tile', speak: false, showSay: false, flip: false });
        c.classList.add('choice');
        c.addEventListener('click', function () { choose(w, c); });
        cards[w.id] = c;

      setTimeout(function () {
        A.cancel();
        A.sayWord(current, { repeats: 2 });
      }, 450);
    }

    function choose(w, node) {
      if (locked) return;
      A.unlock();

        locked = true;
        streak++; score++;

        S.markAnswer(current.id, true);

          A.speakText(U.pickOne(praise), { lang: 'ta' });

          var badge = document.getElementById('star-count'); if (badge) badge.textContent = S.progress.stickers.length;
        }
      } else {

        S.markAnswer(current.id, false);

        A.cancel(); A.sfx('wrong'); U.haptic(60);
        A.speakText('இன்னொரு தடவை கேட்கிறேன்', { lang: 'ta', roman: 'Inna thadavai ketkiren' });
        setTimeout(function () { A.sayWord(current, { repeats: 2 }); }, 900);
      }
    }

    function endGame() {
      U.clear(board);
      var panel = U.el('div.game-done', {}, [
        U.el('div.done-emoji', { text: score >= ROUNDS * 0.7 ? '🏆' : '🌟' }),
        U.el('h2.tamil', { text: 'நல்லா விளையாடின' }),
        U.el('p', { text: score + ' out of ' + ROUNDS + ' correct' }),
        U.el('div.done-actions', {}, [
          UI.bigButton('Again', { icon: '🔁', color: cat ? cat.color : '#7c3aed' }, function () { score = 0; streak = 0; round = 0; scoreEl.textContent = '⭐ 0'; nextRound(); }),
          UI.bigButton('Peek-a-boo', { icon: '🙈', color: '#0ea5e9' }, function () { TT.app.go('play/' + (cat ? cat.key : 'all') + '/peek'); }),
          UI.bigButton('Topics', { icon: '📚', color: '#16a34a' }, function () { TT.app.go('learn'); })
        ])
      ]);
      board.appendChild(panel);
      A.sfx('applause'); TT.confetti.rain({ count: 60 });
      A.speakText('நல்லா விளையாடின. மறுபடி விளையாடுவோமா!', { lang: 'ta', roman: 'Nalla vilaiyadina. Marubadi vilaiyaduroma!' });
    }

    views.play.onLeave = function () {
      cleanup.forEach(function (f) { f(); });
      A.cancel();
    };
    nextRound();
  };

  /* ------------------------------------------------------------ 2 · Peekaboo */

  games.peek = function (host, cat) {
    var pool = cat ? D.catWords(cat.key) : D.allWords();
    var score = 0;
    var head = gameHeader('Peek-a-boo', cat);
    head.children[0].addEventListener('click', function () { A.sfx('tap'); TT.app.go('play/' + (cat ? cat.key : '')); });
    host.appendChild(head);
    host.appendChild(U.el('div.game-prompt', {}, [
      U.el('span.replay-btn.static', { text: '🙈' }),
      U.el('p.game-instruction', {}, [U.el('span.tamil', { text: 'என்ன மறைச்சிருக்கு?' }), U.el('span', { text: ' tap the leaves to look' })])
    ]));

      var opened = 0;
      batch.forEach(function (w) {
        var b = U.el('button.curtain', { type: 'button', 'aria-label': 'What is hiding here?' }, [
