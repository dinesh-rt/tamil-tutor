/* ===== css/app.css ===== */
/* ==========================================================================
   Tamil Tutor — layout & look
   Little fingers first: everything tappable is at least 64px, nothing scrolls
   sideways, and the words are enormous.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
  --font-ta: "Noto Sans Tamil", "Nirmala UI", "Tamil MN", "Latha", "Noto Sans", system-ui, sans-serif;
  --font-round: "Comic Sans MS", "Chalkboard SE", "Baloo Chettan 2", var(--font-ui);

  --sun: #ffd166;
  --sky: #7dd3fc;
  --grape: #7c3aed;
  --grape-2: #a855f7;
  --leaf: #16a34a;
  --rose: #f43f5e;
  --ink: #1f2430;
  --ink-soft: #4b5563;

  --bg-1: #fff7e6;
  --bg-2: #e0f2fe;
  --bg-3: #fde2f3;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e5e7eb;
  --shadow: 0 10px 0 rgba(31, 36, 48, .08), 0 18px 34px rgba(31, 36, 48, .14);
  --shadow-soft: 0 6px 20px rgba(31, 36, 48, .10);
  --radius: 26px;
  --radius-lg: 36px;

  --topbar-h: 62px;
  --tabbar-h: 78px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html[data-theme="night"] {
  --bg-1: #1b1030;
  --bg-2: #0b1b33;
  --bg-3: #2a1046;
  --surface: #241a3d;
  --surface-2: #2e2350;
  --line: #3b2f5f;
  --ink: #f5f3ff;
  --ink-soft: #c7c2e0;
  --shadow: 0 10px 0 rgba(0, 0, 0, .35), 0 18px 34px rgba(0, 0, 0, .45);
  --shadow-soft: 0 6px 22px rgba(0, 0, 0, .5);
}

html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-ui);
  color: var(--ink);
  background: var(--bg-1);
  background-image:
    radial-gradient(120% 90% at 10% -10%, var(--bg-1) 0%, transparent 60%),
    radial-gradient(120% 90% at 110% 10%, var(--bg-3) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 45%, var(--surface-2) 100%);
  background-attachment: fixed;
  min-height: 100%;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  padding-top: calc(var(--topbar-h) + var(--safe-top));
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom));
}

.tamil { font-family: var(--font-ta); line-height: 1.5; }
[hidden] { display: none !important; }

/* ------------------------------------------------------------ background */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-shape { position: absolute; top: -12%; will-change: transform; filter: saturate(.85); }

/* ---------------------------------------------------------------- top bar */
.topbar {
  position: fixed; z-index: 30; top: 0; left: 0; right: 0;
  height: calc(var(--topbar-h) + var(--safe-top));
  padding: var(--safe-top) 10px 0;
  display: flex; align-items: center; gap: 8px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(12px) saturate(1.3);
  -webkit-backdrop-filter: blur(12px) saturate(1.3);
  border-bottom: 2px solid color-mix(in srgb, var(--grape) 18%, var(--line));
  box-shadow: 0 4px 18px rgba(31,36,48,.08);
}

.icon-btn {
  min-width: 48px; min-height: 48px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 18px;
  font-size: 1.35rem; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(31,36,48,.08);
  transition: transform .12s ease, box-shadow .12s ease;
  position: relative;
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.nav-back { font-size: 1.5rem; font-weight: 700; }

.brand {
  display: flex; align-items: center; gap: 8px;
  border: 0; background: none; padding: 6px 8px; margin-right: auto;
  cursor: pointer; color: inherit; position: relative;
}
.brand-ico { font-size: 1.9rem; line-height: 1; }
.brand-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.brand-ta { font-family: var(--font-ta); font-size: 1.05rem; font-weight: 700; color: var(--grape); }
.brand-en { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.hold-ring {
  position: absolute; inset: -2px; border-radius: 20px;
  border: 3px dashed var(--grape);
  animation: holdfill 3s linear forwards;
}

.topbar-actions { display: flex; gap: 6px; }
.badge {
  position: absolute; right: -4px; top: -4px;
  min-width: 22px; height: 22px; padding: 0 5px;
  background: var(--rose); color: #fff;
  border-radius: 999px; font-size: .72rem; font-weight: 800;
  display: grid; place-items: center;
  box-shadow: 0 2px 0 rgba(0,0,0,.15);
}

/* ------------------------------------------------------------------ tabs */
.tabbar {
  position: fixed; z-index: 30; bottom: 0; left: 0; right: 0;
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 2px solid color-mix(in srgb, var(--grape) 18%, var(--line));
}
.tab {
  border: 0; background: none; cursor: pointer; color: var(--ink-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 6px 2px; font-family: inherit;
}
.tab-ico { font-size: 1.7rem; line-height: 1.1; }
.tab-ta { font-family: var(--font-ta); font-size: .82rem; font-weight: 700; }
.tab-en { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; }
.tab.on { color: var(--grape); }
.tab.on .tab-ico { transform: translateY(-2px) scale(1.12); }
.tab.on::after {
  content: ""; position: absolute; bottom: 8px; width: 26px; height: 5px;
  border-radius: 99px; background: var(--grape);
}
.tab { position: relative; }

/* ------------------------------------------------------------------ view */
.view {
  position: relative; z-index: 1;
  max-width: 880px; margin: 0 auto;
  padding: 12px 14px 24px;
}

.section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 22px 2px 12px; }
.section-ta { font-family: var(--font-ta); font-size: 1.5rem; font-weight: 800; margin: 0; color: var(--grape); }
.section-en { margin: 0; font-size: .92rem; color: var(--ink-soft); flex: 1 1 100%; }
.section-head .chip { margin-left: auto; }
.empty { padding: 18px; text-align: center; color: var(--ink-soft); font-size: 1.05rem; }
.foot-note { margin: 26px 6px 8px; font-size: .84rem; color: var(--ink-soft); text-align: center; }
.linkish { border: 0; background: none; color: var(--grape); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

/* ------------------------------------------------------------------ hero */
.hero {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-soft);
  border: 3px solid color-mix(in srgb, var(--grape) 16%, var(--line));
  margin-top: 6px;
}
.hero-small { padding: 12px 14px; }
.hero-mascot { font-size: 3.6rem; line-height: 1; cursor: pointer; }
.hero-elephant { display: inline-block; }
.hero-ta { font-family: var(--font-ta); font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; line-height: 1.25; color: var(--grape); }
.hero-en { margin: 2px 0 8px; font-size: 1.05rem; color: var(--ink-soft); }
.hero-stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
.stat-pill {
  background: color-mix(in srgb, var(--grape) 12%, var(--surface));
  border: 2px solid color-mix(in srgb, var(--grape) 22%, transparent);
  color: var(--ink); border-radius: 99px; padding: 3px 10px; font-size: .82rem; font-weight: 700;
}

/* -------------------------------------------------------- rows and minis */
.row { margin-bottom: 6px; }
.row-cta { display: flex; flex-wrap: wrap; gap: 10px; }

.big-btn {
  flex: 1 1 220px;
  display: flex; align-items: center; gap: 12px;
  min-height: 72px; padding: 12px 16px;
  border: 3px solid color-mix(in srgb, var(--cat, var(--grape)) 55%, #000 5%);
  border-radius: var(--radius);
  background: linear-gradient(160deg, color-mix(in srgb, var(--cat, var(--grape)) 22%, var(--surface)), color-mix(in srgb, var(--cat, var(--grape)) 10%, var(--surface)));
  color: var(--ink); font: inherit; cursor: pointer; text-align: left;
  box-shadow: 0 7px 0 color-mix(in srgb, var(--cat, var(--grape)) 32%, transparent), var(--shadow-soft);
  transition: transform .1s ease, box-shadow .1s ease;
}
.big-btn:active { transform: translateY(6px); box-shadow: var(--shadow-soft); }
.big-btn-ico { font-size: 2.1rem; line-height: 1; }
.big-btn-label { display: flex; flex-direction: column; font-size: 1.15rem; font-weight: 800; }
.big-btn-ta { font-family: var(--font-ta); font-size: .95rem; font-weight: 700; color: var(--ink-soft); }
.big-btn-sub { font-size: .78rem; color: var(--ink-soft); margin-left: auto; align-self: center; }

.mini-row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }

.mini {
  flex: 0 0 auto; width: 104px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 6px 8px;
  border: 3px solid color-mix(in srgb, var(--grape) 18%, var(--line));
  border-radius: 22px;
  background: var(--surface);
  font: inherit; color: inherit; cursor: pointer;
  box-shadow: 0 5px 0 rgba(31,36,48,.07);
  scroll-snap-align: start;
  transition: transform .12s ease;
}
.mini:active { transform: scale(.94); }
.mini-pic { font-size: 2.1rem; line-height: 1.15; display: block; }
.mini-ta { font-family: var(--font-ta); font-size: .96rem; font-weight: 700; text-align: center; line-height: 1.35; }
.mini-en { font-size: .72rem; color: var(--ink-soft); text-align: center; }
.sticker { border-color: color-mix(in srgb, #f59e0b 55%, var(--line)); background: linear-gradient(170deg, #fffbeb, var(--surface)); }

/* --------------------------------------------------------------- tiles */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 1px;
  padding: 14px 14px 18px; min-height: 128px;
  text-decoration: none; color: inherit; font: inherit;
  background: linear-gradient(165deg, color-mix(in srgb, var(--cat) 24%, var(--surface)), var(--surface) 70%);
  border: 3px solid color-mix(in srgb, var(--cat) 45%, transparent);
  border-radius: var(--radius);
  box-shadow: 0 7px 0 color-mix(in srgb, var(--cat) 26%, transparent);
  overflow: hidden;
  transition: transform .14s ease;
}
.tile:active { transform: translateY(5px) scale(.99); box-shadow: none; }
.tile-icon { font-size: 2.3rem; line-height: 1.1; }
.tile-ta { font-family: var(--font-ta); font-size: 1.15rem; font-weight: 800; line-height: 1.4; }
.tile-en { font-size: .82rem; color: var(--ink-soft); }
.tile-count { position: absolute; right: 12px; top: 12px; font-size: .68rem; font-weight: 800; color: color-mix(in srgb, var(--cat) 70%, var(--ink)); background: color-mix(in srgb, var(--cat) 14%, var(--surface)); padding: 2px 8px; border-radius: 99px; }
.tile-bar { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 7px; border-radius: 99px; background: color-mix(in srgb, var(--cat) 15%, var(--line)); overflow: hidden; }
.tile-bar-fill { display: block; height: 100%; border-radius: 99px; background: var(--cat); }
.tile-game::after { content: "🎲"; position: absolute; right: 10px; bottom: 20px; font-size: 1.3rem; opacity: .55; }

/* ---------------------------------------------------------------- cards */
.card {
  position: relative;
  background: var(--surface);
  border: 4px solid color-mix(in srgb, var(--cat, var(--grape)) 34%, var(--line));
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column;
}
.card-big { width: min(94%, 520px); margin: 0 auto; min-height: min(62vh, 470px); justify-content: center; }
.card-tile { padding: 10px; }
.card:focus-visible { outline: 5px solid var(--sun); outline-offset: 3px; }
.card-body { display: flex; flex-direction: column; height: 100%; min-width: 0; }
.card-stage { flex: 1 1 auto; display: grid; place-items: center; padding: 18px 12px 4px; min-height: 0; min-width: 0; }
.card-pic { display: block; max-width: 100%; }
.card-pic > .pic { display: inline-block; max-width: 100%; }
.pic { display: inline-block; line-height: 1; }
.emoji { font-size: clamp(4.6rem, 26vw, 9rem); display: inline-block; }
.card-tile .emoji { font-size: clamp(3rem, 13vw, 4.6rem); }
.emoji-grid { display: grid; gap: 2px; justify-items: center; }
.emoji-grid .emoji { font-size: clamp(1.9rem, 8vw, 2.8rem); }
.emoji-grid.n-1 { grid-template-columns: 1fr; }
.emoji-grid.n-2, .emoji-grid.n-4 { grid-template-columns: repeat(2, 1fr); }
.emoji-grid.n-3, .emoji-grid.n-6 { grid-template-columns: repeat(3, 1fr); }
.emoji-grid.n-5, .emoji-grid.n-7, .emoji-grid.n-8, .emoji-grid.n-9, .emoji-grid.n-10 { grid-template-columns: repeat(4, 1fr); }
.sym-badge {
  position: absolute; left: 16px; top: 12px;
  font-family: var(--font-ta); font-size: 2.6rem; font-weight: 800; color: var(--grape); opacity: .9;
}
.card-pic svg, .card-pic .sprite { width: min(58vw, 260px); max-width: 100%; height: auto; display: block; }
.card-tile .card-pic svg { width: min(26vw, 130px); }

.card-words { padding: 4px 16px 18px; text-align: center; display: grid; gap: 2px; }
.w-ta { font-family: var(--font-ta); font-size: clamp(2rem, 9vw, 3.1rem); font-weight: 800; line-height: 1.5; color: var(--ink); overflow-wrap: break-word; }
.card-tile .w-ta { font-size: clamp(1.2rem, 5.4vw, 1.7rem); line-height: 1.4; }
.w-ro { font-size: 1rem; color: var(--ink-soft); font-style: italic; letter-spacing: .02em; }
.w-en { font-size: clamp(1.05rem, 4.4vw, 1.5rem); font-weight: 700; color: color-mix(in srgb, var(--grape) 78%, var(--ink)); overflow-wrap: break-word; }
.big-ta { font-size: clamp(2.4rem, 11vw, 3.6rem); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 2px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer;
  box-shadow: 0 3px 0 rgba(31,36,48,.06);
}
.chip:active { transform: translateY(2px); box-shadow: none; }
.chip-say { margin: 6px auto 0; justify-content: center; border-color: color-mix(in srgb, var(--leaf) 40%, var(--line)); background: color-mix(in srgb, var(--leaf) 10%, var(--surface)); }
.chip-say .tamil { font-size: .95rem; }
.chip-ico { font-size: 1.05rem; }
.chip-danger { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.level-dot { position: absolute; right: 14px; top: 14px; width: 16px; height: 16px; border-radius: 99px; background: #9ca3af; box-shadow: 0 0 0 4px rgba(0,0,0,.05); }
.level-dot[data-lvl="1"] { background: #f59e0b; }
.level-dot[data-lvl="2"] { background: #22c55e; }
.level-dot[data-lvl="3"] { background: #16a34a; box-shadow: 0 0 0 4px rgba(34,197,94,.25); }

/* flip cards */
.card-flip { perspective: 1200px; }
.card-flip .face { backface-visibility: hidden; transition: transform .45s cubic-bezier(.2,.9,.2,1); grid-area: 1/1; }
.card-flip { display: grid; }
.card-flip .face.back { transform: rotateY(180deg); }
.card-flip[data-side="back"] .face.front { transform: rotateY(-180deg); }
.card-flip[data-side="back"] .face.back { transform: rotateY(0deg); }
.flip-words { text-align: center; display: grid; gap: 4px; }

/* ------------------------------------------------------- flashcard deck */
.deck-bar { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.deck-meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.deck-cat { font-family: var(--font-ta); font-weight: 800; font-size: 1.1rem; }
.deck-count { font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.deck-progress { flex: 1 1 auto; height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--grape) 14%, var(--line)); overflow: hidden; }
.deck-progress-fill { display: block; height: 100%; border-radius: 99px; transition: width .3s ease; }

.deck-stage {
  position: relative; display: grid; place-items: center;
  min-height: min(62vh, 470px);
  touch-action: pan-y;
}
.deck-stage .card { grid-area: 1/1; }
.autoplay-ring {
  position: absolute; inset: auto 6px 6px auto; width: 46px; height: 46px; border-radius: 99px;
  display: none;
}
.autoplay-ring.on {
  display: block;
  background: conic-gradient(var(--grape) var(--p, 0%), color-mix(in srgb, var(--grape) 15%, transparent) 0);
  border-radius: 99px;
  opacity: .85;
}
.nav-arrow, .nav-hint { border: 0; background: none; font: inherit; cursor: pointer; color: inherit; }
.deck-nav {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  margin-top: 10px;
}
.nav-arrow {
  min-height: 84px; border-radius: 26px;
  background: var(--surface); border: 3px solid color-mix(in srgb, var(--grape) 30%, var(--line));
  box-shadow: 0 7px 0 color-mix(in srgb, var(--grape) 22%, transparent);
  font-size: 2.2rem; color: var(--grape);
}
.nav-arrow:active { transform: translateY(6px); box-shadow: none; }
.nav-arrow span { display: block; }
.nav-hint { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-soft); padding: 8px 14px; }
.nav-hint span { font-size: 1.8rem; }
.nav-hint small { font-size: .72rem; }

.deck-done, .game-done { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 22px 10px; width: 100%; }
.game-done.inline { padding: 14px; }
.done-emoji { font-size: 4rem; }
.deck-done h2, .game-done h2 { font-family: var(--font-ta); font-size: clamp(1.7rem, 7vw, 2.4rem); margin: 0; color: var(--grape); }
.done-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }

/* -------------------------------------------------------------- games */
.game-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.game-title { margin: 0; font-size: 1.15rem; display: flex; flex-direction: column; line-height: 1.15; flex: 1 1 auto; }
.game-title-ta { font-family: var(--font-ta); color: var(--cat, var(--grape)); font-size: 1.2rem; }
.game-score { font-weight: 800; font-size: 1.2rem; background: var(--surface); border: 2px solid var(--line); padding: 6px 12px; border-radius: 99px; }

.game-prompt {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border-radius: var(--radius);
  border: 3px dashed color-mix(in srgb, var(--cat, var(--grape)) 35%, var(--line));
  padding: 10px 14px; margin-bottom: 14px;
}
.replay-btn {
  min-width: 72px; min-height: 72px; border-radius: 99px; font-size: 2rem;
  border: 3px solid var(--grape); background: color-mix(in srgb, var(--sun) 45%, var(--surface));
  cursor: pointer; box-shadow: 0 6px 0 color-mix(in srgb, var(--grape) 25%, transparent);
}
.replay-btn:active { transform: translateY(5px); box-shadow: none; }
.replay-btn.static { cursor: default; }
.game-instruction { margin: 0; font-size: 1.08rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.game-instruction .tamil { font-size: 1.3rem; font-weight: 800; color: var(--grape); }

.game-board { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.game-board.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.game-board.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .game-board.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.game-board .card { min-height: 150px; }
.choice.right { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 10%, var(--surface)); }

  var words = [];

  var wordsByCat = Object.create(null);
  var dupes = [];

  function slug(str) {
    return String(str).toLowerCase()
      .replace(/[’'`.]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function category(def) {
    if (!def || !def.key) throw new Error('category needs a key');
    if (catByKey[def.key]) return catByKey[def.key];
    var cat = {
      key: def.key,
      en: def.en || def.key,
      ta: def.ta || '',
      icon: def.icon || '🔤',
      color: def.color || '#7c3aed',
      color2: def.color2 || null,
      desc: def.desc || '',
      order: (def.order == null ? categories.length : def.order),
      words: []
    };
    categories.push(cat);
    catByKey[cat.key] = cat;
    wordsByCat[cat.key] = cat.words;
    return cat;
  }

  function word(catKey, w) {
    var cat = catByKey[catKey];
    if (!cat) throw new Error('unknown category: ' + catKey);
    if (!w || !w.en || !w.ta || !w.ro || !w.img) {
      throw new Error('word in ' + catKey + ' is missing a field: ' + JSON.stringify(w));
    }
    var item = {
      id: catKey + '/' + slug(w.en),
      cat: catKey,
      catRef: cat,
      en: String(w.en).trim(),
      ta: String(w.ta).trim(),
      ro: String(w.ro).trim(),
      img: String(w.img).trim(),
      mo: w.mo || null, /* no animation = a still picture, which is most words */
      say: w.say || null,
      note: w.note || null,
      tag: [].concat(w.tag || [])
    };
    if (wordById[item.id]) { dupes.push(item.id); return wordById[item.id]; }
    words.push(item);
    wordById[item.id] = item;
    cat.words.push(item);
    return item;
  }

  function wordsFor(catKey, list) {
    for (var i = 0; i < list.length; i++) word(catKey, list[i]);
  }

  /* ---- queries --------------------------------------------------------- */

  function allWords() { return words; }
  function allCategories() { return categories.slice().sort(function (a, b) { return a.order - b.order; }); }
  function getCat(key) { return catByKey[key] || null; }
  function getWord(id) { return wordById[id] || null; }
  function catWords(key) { return wordsByCat[key] || []; }

  function wordsIn(keys) {
    var out = [];
    for (var i = 0; i < keys.length; i++) out = out.concat(catWords(keys[i]));
    return out;
  }

  function search(q) {
    q = String(q || '').toLowerCase().trim();
    if (!q) return [];
    return words.filter(function (w) {
      return w.en.toLowerCase().indexOf(q) > -1 ||
             w.ro.toLowerCase().indexOf(q) > -1 ||
             w.ta.indexOf(q) > -1 ||
             w.tag.join(' ').toLowerCase().indexOf(q) > -1;
    });
  }

  /* ---- shuffling / picking --------------------------------------------- */

  function shuffle(list, rnd) {
    var a = list.slice(), r = rnd || Math.random, i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(r() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /** n distinct words, optionally restricted to a category, in random order */
  function pick(catKey, n, opts) {
    opts = opts || {};
    var pool = catKey ? catWords(catKey) : words;
    if (opts.exclude) {
      var ex = {};
      opts.exclude.forEach(function (w) { ex[w.id] = 1; });
      pool = pool.filter(function (w) { return !ex[w.id]; });
    }
    return shuffle(pool).slice(0, n);
  }

  TT.data = {
    slug: slug,
    category: category,
    words: wordsFor,
    allWords: allWords,
    allCategories: allCategories,
    getCat: getCat,
    getWord: getWord,
    catWords: catWords,
    wordsIn: wordsIn,
    search: search,
    shuffle: shuffle,
    pick: pick,
    dupeIds: dupes,
    TAMIL_RE: TAMIL_RE
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ===== js/data/library.js ===== */
/* Books: ten tiny board-books, stitched from words this app already knows.

   Deliberately conservative about language. Every page is an existing word
   card, so the Tamil on screen and the Tamil on the ear are both the ones the
   word bank already ships — this file invents no sentences and needs no new
   recordings. Titles come from the word bank's own category names for the
   same reason.

   Page kinds the reader understands:
     word   {k:'word',  w:'animals/cow', hide:true?}   hide = peek-a-boo page
     count  {k:'count', n:3, item:'toys/ball', num:'numbers/three'}
     quiz   {k:'quiz',  w:'animals/lion', cat:'animals'}  tap the one you heard
     line   {k:'line',  ta:'…', en:'…', clip:'books/x/p01.mp3', dur:3.4}
                                                            ← real stories later
   `cover` and `end` are added for you. A page whose word can't be found is
   dropped at load, so a renamed word costs a page and not a broken book.     */
(function (TT) {
  'use strict';
  var D = TT.data;

  var books = [], byId = {};
  var storyPack = null;

  /* A story is only shippable once it can be heard. The word-books narrate
     themselves from the existing pack, but a story page is one spoken line and
     those clips are made by tools/make-story-pack.py — so a book whose audio
     has not been generated yet is not a book, it is a silent screen a
     two-year-old taps at. Stories stay off the shelf until
     audio/books/manifest.json says their clips exist. */
  function loadStoryPack() {
    /* Under file:// a fetch either fails outright or is refused, and a story
       with no way to be heard is simply not offered — so don't ask. A portable
       bundle can hand the index over directly as window.TT_STORY_PACK. */
    var injected = typeof window !== 'undefined' && window.TT_STORY_PACK;
    if (!injected) {
      if (typeof fetch !== 'function') return;
      if (typeof location !== 'undefined' && location.protocol === 'file:') return;
    }
    var asking = injected
      ? Promise.resolve({ ok: true, json: function () { return Promise.resolve(window.TT_STORY_PACK); } })
      : fetch('audio/books/manifest.json', { cache: 'no-cache' });
    asking
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        storyPack = (j && j.books) || j || {};
        books.forEach(function (b) {
          if (!b.story) return;
          var rec = storyPack[b.id];
          /* complete, not merely present: a half-narrated book would open on
             page 3 with nothing to hear */
          b.ready = !!(rec && rec.complete && rec.pages && rec.pages.length === b.pages.length);
          if (!b.ready || !rec.pages) return;
          rec.pages.forEach(function (m, i) {
            if (!m) return;
            b.pages[i].dur = m.dur || 0;
            /* the pack names clips after the text that made them, so an edited
               line gets a new filename and the worker cannot serve the old one */
            if (m.file) b.pages[i].clip = 'audio/books/' + b.id + '/' + m.file;
          });
          b._pages = null;   // pagesOf() may be cached from before the durations arrived
        });
        /* the shelf is often already painted by the time this answer lands —
           without this the Books tab shows ten books or twenty depending on
           whether a fetch won the race, which is the kind of bug a toddler
           finds and a grown-up cannot reproduce */
        if (typeof window !== 'undefined' && window.dispatchEvent) {
          try { window.dispatchEvent(new CustomEvent('tt:stories-ready')); } catch (e) { /* ignore */ }
        }
      })
      .catch(function () { /* no pack: the shelf simply has no stories */ });
  }

  function exists(ref) { return !!ref && !!D.getWord(ref); }

  function book(def) {
    if (!def || !def.id || !def.pages) return;
    var cat = def.cat || (def.pages[0] && def.pages[0].w || '').split('/')[0];
    var c = D.getCat(cat);
    def.cat = cat;
    def.ta = def.ta || (c && c.ta) || def.en;
    def.icon = def.icon || (c && c.icon) || '📖';
    def.color = def.color || (c && c.color) || '#f59e0b';
    def.en = def.en || def.ta;

    def.pages = def.pages.filter(function (p) {
      if (p.k === 'quiz') return exists(p.w);
      if (p.k === 'count') return exists(p.item) && exists(p.num);
      if (p.k === 'line') return !!(p.ta && p.clip);
      if (p.k === 'moral') return !!p.ta;   // the moral has no word to check, only a line
      return exists(p.w);
    });
    if (!def.pages.length) return;
    if (def.story) def.ready = !!(storyPack && storyPack[def.id]);
    /* the single-file bundle is one file with nothing beside it, so a cover it
       cannot have is not worth a request; the emoji was the cover first */
    if (typeof window !== 'undefined' && window.TT_SINGLE_FILE) def.art = null;
    if (!byId[def.id]) { books.push(def); byId[def.id] = def; }
  }

  /* cover + content + the page that celebrates */
  function pagesOf(b) {
    if (!b._pages) {
      b._pages = [{ k: 'cover' }].concat(b.pages).concat([{ k: 'end', w: firstWord(b) }]);
    }
    return b._pages;
  }

  /* the sticker a finished book leaves behind */
  function firstWord(b) {
    for (var i = 0; i < b.pages.length; i++) {
      var p = b.pages[i];
      if (p.w && exists(p.w)) return p.w;
      if (p.item && exists(p.item)) return p.item;
    }
    return null;
  }

  function all() { return books.filter(function (b) { return !b.story || b.ready; }); }
  function shelf() { return books; }
  function get(id) {
    var b = byId[id] || null;
    return (b && (!b.story || b.ready)) ? b : null;
  }
  function word(ref) { return exists(ref) ? D.getWord(ref) : null; }

  /* ------------------------------------------------------------------ shelf */

  book({
    id: 'animals', en: 'Animal Friends',
    pages: [
      { k: 'word', w: 'animals/dog' },
      { k: 'word', w: 'animals/cat' },
      { k: 'word', w: 'animals/cow' },
      { k: 'word', w: 'animals/elephant', hide: true },
      { k: 'word', w: 'animals/horse' },
      { k: 'word', w: 'animals/goat' },
      { k: 'quiz', w: 'animals/lion' }
    ]
  });

  book({
    id: 'birds', en: 'Birds Up High',
    pages: [
      { k: 'word', w: 'birds/bird' },
      { k: 'word', w: 'birds/peacock' },
      { k: 'word', w: 'birds/parrot' },
      { k: 'word', w: 'birds/hen' },
      { k: 'word', w: 'birds/duck' },
      { k: 'word', w: 'birds/crow', hide: true },
      { k: 'quiz', w: 'birds/owl' }
    ]
  });

  book({
    id: 'fruits', en: 'Sweet Fruits',
    pages: [
      { k: 'word', w: 'fruits/mango' },
      { k: 'word', w: 'fruits/banana' },
      { k: 'word', w: 'fruits/apple' },
      { k: 'word', w: 'fruits/grapes' },
      { k: 'word', w: 'fruits/jackfruit', hide: true },
      { k: 'count', n: 3, item: 'fruits/banana', num: 'numbers/three' },
      { k: 'quiz', w: 'fruits/watermelon' }
    ]
  });

  book({
    id: 'sea', en: 'The Big Sea',
    pages: [
      { k: 'word', w: 'sea/fish' },
      { k: 'word', w: 'sea/crab' },
      { k: 'word', w: 'sea/whale' },
      { k: 'word', w: 'sea/dolphin' },
      { k: 'word', w: 'sea/seahorse', hide: true },
      { k: 'word', w: 'sea/shell' },
      { k: 'quiz', w: 'sea/octopus' }
    ]
  });

  book({
    id: 'sky', cat: 'nature', en: 'Sky, Sun, Rain',
    pages: [
      { k: 'word', w: 'nature/sun' },
      { k: 'word', w: 'nature/moon' },
      { k: 'word', w: 'nature/star' },
      { k: 'word', w: 'nature/cloud' },
      { k: 'word', w: 'nature/rain' },
      { k: 'word', w: 'nature/rainbow', hide: true },
      { k: 'quiz', w: 'weather/umbrella', cat: 'weather' }
    ]
  });

  book({
    id: 'colours', cat: 'colors', en: 'All the Colours',
    pages: [
      { k: 'word', w: 'colors/red' },
      { k: 'word', w: 'colors/blue' },
      { k: 'word', w: 'colors/green' },
      { k: 'word', w: 'colors/yellow' },
      { k: 'word', w: 'colors/pink' },
      { k: 'word', w: 'colors/white', hide: true },
      { k: 'quiz', w: 'colors/purple' }
    ]
  });

  book({
    id: 'counting', cat: 'numbers', en: 'One to Five',
    pages: [
      { k: 'count', n: 1, item: 'toys/ball', num: 'numbers/one' },
      { k: 'count', n: 2, item: 'toys/kite', num: 'numbers/two' },
      { k: 'count', n: 3, item: 'nature/star', num: 'numbers/three' },
      { k: 'count', n: 4, item: 'nature/flower', num: 'numbers/four' },
      { k: 'count', n: 5, item: 'birds/bird', num: 'numbers/five' },
      { k: 'word', w: 'actions/count' },
      { k: 'quiz', w: 'numbers/three' }
    ]
  });

  book({
    id: 'body', en: 'My Body',
    pages: [
      { k: 'word', w: 'body/head' },
      { k: 'word', w: 'body/eyes' },
      { k: 'word', w: 'body/nose' },
      { k: 'word', w: 'body/mouth' },
      { k: 'word', w: 'body/hand' },
      { k: 'word', w: 'body/leg' },
      { k: 'word', w: 'body/hair', hide: true },
      { k: 'quiz', w: 'body/heart' }
    ]
  });

  book({
    id: 'vehicles', en: 'Off We Go',
    pages: [
      { k: 'word', w: 'vehicles/car' },
      { k: 'word', w: 'vehicles/bus' },
      { k: 'word', w: 'vehicles/train' },
      { k: 'word', w: 'vehicles/aeroplane' },
      { k: 'word', w: 'vehicles/bicycle' },
      { k: 'word', w: 'vehicles/boat' },
      { k: 'word', w: 'vehicles/rocket', hide: true },
      { k: 'quiz', w: 'vehicles/helicopter' }
    ]
  });

  book({
    id: 'family', en: 'People I Love',
    pages: [
      { k: 'word', w: 'family/mother' },
      { k: 'word', w: 'family/father' },
      { k: 'word', w: 'family/grandmother' },
      { k: 'word', w: 'family/grandfather' },
      { k: 'word', w: 'family/baby' },
      { k: 'word', w: 'family/friend', hide: true },
      { k: 'quiz', w: 'family/elder-sister' }
    ]
  });

  TT.books = {
    book: book,
    all: all,
    shelf: shelf,
    get: get,
    word: word,
    pagesOf: pagesOf,
    firstWord: firstWord,
    storiesWaiting: function () {
      return books.filter(function (b) { return b.story && !b.ready; }).length;
    }
  };

  loadStoryPack();
})(window.TT = window.TT || {});

<script>
/* ===== js/data/stories.js ===== */
/* Ten real Tamil story-books.

   All ten are old folk tales — Panchantantrum and Aesop material that has
   belonged to nobody for a few thousand years — retold in short sentences for
   two-to-five-year-olds, with the sharp endings softened the way grandmother
   versions soften them. Nothing here is under copyright.

   One page is one spoken line, narrated into audio/books/<id>/p<nn>.mp3 by
   tools/make-story-pack.py, which also writes `dur` back into each page after
   measuring the file with ffprobe. So: edit `ta` here, re-run the tool, and
   the book re-narrates itself.

   `ro` is the transliteration and `en` the gloss. They are there so a grown-up
   can check a Tamil line at a glance — these retellings are simple sentences,
   but they were written by a machine, and a language tutor should have a human
   read them before a child does.
*/
(function (TT) {
  'use strict';

  var B = TT.books;

  function story(def) {
    def.story = true;
    def.ages = def.ages || '3-6';
    /* the stable cover name, not the generated one — tools/make-story-art.py
       --promote writes this file, and re-promoting swaps the picture without
       a line of data changing here */
    def.art = def.art || 'images/books/cover-' + def.id + '.webp';
    def.pages = (def.pages || []).map(function (p, i) {
      var nn = ('0' + (i + 1)).slice(-2);
      return {
        k: 'line',
        ta: p.ta,
        ro: p.ro || '',
        en: p.en || '',
        clip: 'audio/books/' + def.id + '/p' + nn + '.mp3',
        dur: p.dur || 0
      };
    });
    if (def.moral) {
      def.pages.push({
        k: 'moral', ta: def.moral.ta, ro: def.moral.ro || '', en: def.moral.en || '',
        clip: 'audio/books/' + def.id + '/p-moral.mp3', dur: def.moral.dur || 0
      });
    }
    B.book(def);
  }

  /* ────────────────────────────── 1. the thirsty crow — Panchantantrum */
  story({
    id: 'kakku-kudam',
    ta: 'காக்கையும் குடமும்',
    en: 'The Thirsty Crow',
    icon: '🐦‍⬛',
    color: '#475569',
    pages: [
      { ta: 'ஒரு சூடான நாள். ஒரு காக்கைக்கு மிகவும் தாகம்.', ro: 'oru sūḍāna nāḷ. oru kākkaiku migavum thagam.', en: 'One hot day, a crow was very thirsty.' },
      { ta: 'அது ஒரு மரத்தடியில் உட்கார்ந்தது. "எங்கே தண்ணீர்?"', ro: 'adhu oru marathadiyil ukkārnthadhu. "engē thaṇṇīr?"', en: 'It sat under a tree. "Where is water?"' },
      { ta: 'அருகே ஒரு குடம்! உள்ளே தண்ணீர் — ஆனால் மிகக் குறைவு.', ro: 'aruḡē oru kuḍam! uḷḷē thaṇṇīr — āṉāl migak kuṟaivu.', en: 'Nearby, a pot! Water inside — but far too little.' },

<script>
/* ===== js/lib/audio.js ===== */
/* Speech (words spoken aloud) + sound effects synthesised with WebAudio.

(function (TT) {
  'use strict';

  /* ------------------------------------------------------------------ voices */

  var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;

  var unlocked = false;

  function refreshVoices() {
    if (!synth) return;

  }

    refreshVoices();

    setTimeout(refreshVoices, 300);
    setTimeout(refreshVoices, 1200);

  function voiceList() { refreshVoices(); return voices; }

  function bestVoice(lang, overrideURI) {
    var list = voiceList();
    if (overrideURI) {
      for (var i = 0; i < list.length; i++) if (list[i].voiceURI === overrideURI) return list[i];
    }
    var base = String(lang || '').toLowerCase().split('-')[0];
    var exact = [], same = [], i, v, l;
    for (i = 0; i < list.length; i++) {
      v = list[i]; l = String(v.lang || '').toLowerCase();
      if (l === String(lang || '').toLowerCase()) exact.push(v);
      else if (l.split('-')[0] === base) same.push(v);
    }
    /* prefer "local" (on-device) voices: they sound far better for Tamil */
    function score(v) {
      var s = 0, n = String(v.name || '');
      if (v.localService) s += 4; else if (TT.store && TT.store.settings.localVoicesOnly) s -= 200;  // nothing may leave the device
      if (/tamil|tam/i.test(n)) s += 6;
      if (/google/i.test(n)) s += 1;
      if (/natural|enhanced|premium/i.test(n)) s += 3;
      if (/female|woman|zira|veena|heera|kalpana|swara|lekha/i.test(n)) s += 1;
      return s;
    }
    function sortDesc(a, b) { return score(b) - score(a); }
    exact.sort(sortDesc); same.sort(sortDesc);
    return exact[0] || same[0] || null;
  }

  function hasVoiceFor(lang) { return !!bestVoice(lang, null); }

  /* ------------------------------------------------------------------- speak */

  var queue = [];      // [{text,lang,rate,pitch,onend}]
  var safetyCounter = 0;   /* must be declared before speakNext uses it */
  var speaking = false;
  var token = 0;       // invalidates old chains when cancelled

  /** Deliver a job's completion callback exactly once.
      Callers drive the UI from it (autoplay, the games), so it must fire even
      when the utterance was cancelled or the engine never calls back. */
  function settle(job) {
    if (!job || job.settled) return;
    job.settled = true;
    if (job.onend) { try { job.onend(); } catch (e) { /* keep going */ } }
  }

  function speakNext() {
    if (speaking || !queue.length) return;
    if (!synth) { // no TTS at all — still run the timings so the UI keeps moving
      var drop = queue.shift();
      speaking = true;
      setTimeout(function () { settle(drop); }, 900);
      setTimeout(function () { speaking = false; speakNext(); }, 900);

    var all = TT.data.allWords();
    for (i = 0; i < all.length; i++) { counts[level(all[i].id)]++; }
    n = all.length;
    return {
      total: n,
      seen: counts[1] + counts[2] + counts[3],
      familiar: counts[2] + counts[3],
      mastered: counts[3],
      new: counts[0],
      stickers: db.progress.stickers.length,
      sessions: db.progress.sessions,
      minutes: db.progress.minutes,
      streak: db.progress.streak
    };
  }

  /** Words worth revisiting: mis-tapped, overdue in their box, or seen a lot without ever getting one right. */
  function reviewQueue(catKey, limit) {
    var pool = catKey ? TT.data.catWords(catKey) : TT.data.allWords();
    var now = Date.now(), scored = [];
    pool.forEach(function (w) {
      var r = db.progress.words[w.id];
      if (!r) return;
      var score = 0;
      if (r.wrong >= 1) score += 3 + Math.min(4, r.wrong);
      if (r.seen >= 3 && r.correct === 0) score += 3;
      if ((r.next || 0) && r.next <= now) score += 4 - Math.min(3, r.box || 0);   // overdue counts
      if (level(w.id) === 0) score -= 5;
      if (score > 0) scored.push({ w: w, s: score });
    });
    scored.sort(function (a, b) { return b.s - a.s; });
    return scored.slice(0, limit || 12).map(function (x) { return x.w; });
  }

  /** Overdue words, most-needed first. */
  function dueWords(limit, now) {
    now = now || Date.now();
    var picked = TT.data.allWords().filter(function (w) {
      var r = db.progress.words[w.id];
      return !!r && r.seen > 0 && (r.next || 0) <= now;
    });
    picked.sort(function (a, b) {
      var ra = db.progress.words[a.id], rb = db.progress.words[b.id];
      if ((ra.wrong || 0) !== (rb.wrong || 0)) return (rb.wrong || 0) - (ra.wrong || 0);   // troublemakers first
      if ((ra.box || 0) !== (rb.box || 0)) return (ra.box || 0) - (rb.box || 0);            // shaky boxes first
      return (ra.next || 0) - (rb.next || 0);                                              // most overdue first
    });
    return typeof limit === 'number' ? picked.slice(0, limit) : picked;
  }

  /** Words this child has never met. */
  function freshWords(limit) {
    var fresh = TT.data.allWords().filter(function (w) {
      var r = db.progress.words[w.id];
      return !r || !r.seen;
    });
    for (var i = fresh.length - 1; i > 0; i--) {          // Fisher–Yates, no helper needed
      var j = Math.floor(Math.random() * (i + 1)), t = fresh[i]; fresh[i] = fresh[j]; fresh[j] = t;
    }
    return typeof limit === 'number' ? fresh.slice(0, limit) : fresh;
  }

  function dueCount() { return dueWords().length; }

  /** Today's deck: what is overdue, plus a couple of brand-new words so it never feels stale. */
  function todayWords(limit) {
    limit = limit || 8;
    var due = dueWords(), fresh = freshWords();
    var nFresh = Math.min(2, fresh.length);
    var nDue = Math.min(due.length, Math.max(0, limit - nFresh));
    nFresh = Math.min(fresh.length, Math.max(nFresh, limit - nDue));
    return due.slice(0, nDue).concat(fresh.slice(0, nFresh));
  }

  /** For the grown-up screens: where a word sits and when it comes back. */
  function boxInfo(id) {
    var r = db.progress.words[id] || { box: 0, next: 0 };
    var box = r.box || 0, next = r.next || 0;
    return { box: box, days: BOX_DAYS[box], due: !next || next <= Date.now(), dueIn: Math.max(0, Math.ceil((next - Date.now()) / DAY)) };
  }

  function addSticker(wordId, cat) {
    db.progress.stickers.push({ wordId: wordId, cat: cat, at: Date.now() });
    if (db.progress.stickers.length > 500) db.progress.stickers.shift();
    save();
  }

  /* books ------------------------------------------------------------------
     A finished book leaves exactly one sticker behind, however many times the
     same child reads it — a second ⭐ for the same book teaches them that
     stars are not worth anything. */
  function bookState(id) {
    var b = db.progress.books && db.progress.books[id];
    if (!b) return { page: 0, reads: 0, finished: false };
    return { page: b.page || 0, reads: b.reads || 0, finished: !!b.finished };
  }

  function markBookPage(id, page) {
    var b = db.progress.books[id] || (db.progress.books[id] = { page: 0, reads: 0, finished: false });
    if (page > (b.page || 0)) { b.page = page; save(); }
  }

  function finishBook(id) {
    var b = db.progress.books[id] || (db.progress.books[id] = { page: 0, reads: 0, finished: false });
    var firstTime = !b.finished;
    b.reads = (b.reads || 0) + 1;
    b.finished = true;
    if (firstTime && TT.books && TT.books.get) {
      var bk = TT.books.get(id);
      var w = bk && TT.books.firstWord(bk);
      if (w) addSticker(w, bk.cat);
    }
    save();
    return { firstTime: firstTime };
  }

  function startSession() {
    db.progress.sessions++;
    var t = U.todayKey();
    if (db.progress.lastDay !== t) {
      var y = U.todayKey(new Date(Date.now() - 864e5));
      db.progress.streak = (db.progress.lastDay === y) ? (db.progress.streak + 1) : 1;
      db.progress.lastDay = t;
    }
    save();
  }

  function addMinutes(m) { db.progress.minutes += m; save(); }

  function resetProgress() {
    db.progress = JSON.parse(JSON.stringify(EMPTY_PROGRESS));
    save();
  }

  function resetSettings() { db.settings = Object.assign({}, DEFAULTS); save(); }
  function wipe() {
    db = blank(); memoryOnly = false; persistError = null; lostOnLoad = false;
    try { localStorage.removeItem(KEY + '.bak'); } catch (e) { }
    save();
  }

  /* how well can we actually remember things on this device? */
  function canPersist() { return !memoryOnly; }
  function storageStatus() {
    return {
      persist: !memoryOnly, error: persistError, version: db.version,
      recovered: recoveredFromBackup, lostOnLoad: lostOnLoad,
      words: Object.keys(db.progress.words).length, custom: db.custom.length
    };
  }

  /* ------------------------------------------------------------------ custom */

  function addCustom(def) {
    if (!def || !def.en || !def.ta) return null;
    def.ro = def.ro || def.en;
    def.img = def.img || '🔤';
    def.id = (def.cat || 'custom') + '/' + TT.data.slug(def.en);
    db.custom.push(def);
    save();
    return def;
  }
  function removeCustom(i) { db.custom.splice(i, 1); save(); }
  function updateCustom(i, def) { db.custom[i] = def; save(); }

  TT.store = {
    KEY: KEY,
    DEFAULTS: DEFAULTS,
    LEVELS: LEVELS,
    load: load,
    save: save,
    get settings() { return db.settings; },
    get progress() { return db.progress; },
    get custom() { return db.custom; },
    get persistent() { return !memoryOnly; },
    markSeen: markSeen,
    markAnswer: markAnswer,
    level: level,
    levelInfo: levelInfo,
    stats: stats,
    reviewQueue: reviewQueue,
    dueWords: dueWords,
    dueCount: dueCount,
    freshWords: freshWords,
    todayWords: todayWords,
    boxInfo: boxInfo,
    BOX_DAYS: BOX_DAYS,
    addSticker: addSticker,
    bookState: bookState,
    markBookPage: markBookPage,
    finishBook: finishBook,
    startSession: startSession,
    addMinutes: addMinutes,
    resetProgress: resetProgress,
    resetSettings: resetSettings,
    wipe: wipe,
    canPersist: canPersist,
    storageStatus: storageStatus,
    CURRENT_VERSION: CURRENT_VERSION,
    addCustom: addCustom,
    removeCustom: removeCustom,
    updateCustom: updateCustom
  };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/lib/confetti.js ===== */
/* Confetti & star bursts on a single canvas. Respects reduced-motion. */
(function (TT) {
  'use strict';

  var canvas = null, ctx = null, parts = [], raf = null, dpr = 1;
  var COLORS = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#0ea5e9', '#a855f7', '#ec4899', '#14b8a6'];

  function ensure() {
    if (canvas) return true;
    canvas = document.getElementById('fx');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'fx';
      canvas.className = 'fx-canvas';
      document.body.appendChild(canvas);
    }
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize, { passive: true });
    return !!ctx;
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }

  function make(x, y, opts) {
    var a = Math.random() * Math.PI * 2;
    var sp = (opts.speed || 7) * (0.4 + Math.random());
    return {
      x: x, y: y,
      vx: Math.cos(a) * sp * (opts.spread || 1),
      vy: Math.sin(a) * sp - (opts.up || 4),
      g: opts.g == null ? 0.16 : opts.g,
      w: 6 + Math.random() * 9,
      h: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      life: 1,
      decay: 0.006 + Math.random() * 0.008,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      shape: Math.random() < 0.25 ? 'star' : (Math.random() < 0.5 ? 'circle' : 'rect')
    };
  }

  function loop() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      if (p.life <= 0 || p.y > window.innerHeight + 60) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x * dpr, p.y * dpr);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(0, 0, p.w * 0.5 * dpr, 0, 6.3); ctx.fill();
      } else if (p.shape === 'star') {
        ctx.beginPath();
        for (var k = 0; k < 5; k++) {
          var a1 = (k * 2 * Math.PI) / 5 - Math.PI / 2, a2 = a1 + Math.PI / 5;
          ctx.lineTo(Math.cos(a1) * p.w * dpr, Math.sin(a1) * p.w * dpr);
          ctx.lineTo(Math.cos(a2) * p.w * 0.45 * dpr, Math.sin(a2) * p.w * 0.45 * dpr);
        }
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillRect(-p.w * 0.5 * dpr, -p.h * 0.5 * dpr, p.w * dpr, p.h * dpr);
      }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }

  function start() { if (!raf) raf = requestAnimationFrame(loop); }

  function burst(x, y, opts) {
    if (TT.store && TT.store.settings.reduceMotion) return;
    if (TT.util.prefersReducedMotion() && !(opts && opts.force)) return;
    if (!ensure()) return;
    opts = opts || {};
    var n = opts.count || 42;
    for (var i = 0; i < n; i++) parts.push(make(x, y, opts));
    if (parts.length > 700) parts.splice(0, parts.length - 700);
    start();
  }

  function rain(opts) {
    opts = opts || {};
    if (TT.store && TT.store.settings.reduceMotion) return;
    if (!ensure()) return;
    var w = window.innerWidth;
    for (var i = 0; i < (opts.count || 60); i++) {
      var p = make(Math.random() * w, -20 - Math.random() * 300, { g: 0.08, speed: 2, up: -1 });
      p.decay = 0.0035;
      parts.push(p);
    }
    start();
  }

  /** Celebrate at the centre of an element. */
  function atEl(node, opts) {
    var r = node.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, opts);
  }

  TT.confetti = { burst: burst, rain: rain, atEl: atEl, clear: function () { parts = []; if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); } };
})(window.TT = window.TT || {});

</script>
<script>
/* ===== js/ui.js ===== */
/* Shared building blocks: cards, tiles, sheets, toasts. */
(function (TT) {
  'use strict';
  var U = TT.util, A = TT.audio, D = TT.data;

  /* --------------------------------------------------------------- pictures */

  function pictureHTML(word, cls) {
    var svg = TT.spriteFor(word.img);
    var inner = svg;
    if (!inner) {
      var n = Math.max(1, Math.min(10, word.q || 1));
      var bits = [];
      for (var i = 0; i < n; i++) bits.push('<span class="emoji">' + U.esc(word.img) + '</span>');
      inner = n > 1 ? '<span class="emoji-grid n-' + n + '">' + bits.join('') + '</span>' : bits[0];
    }
    var sym = word.sym ? '<span class="sym-badge">' + U.esc(word.sym) + '</span>' : '';
    /* Only verbs (and a few always-moving things) carry an `mo` animation.
       Everything else is a still picture — calmer to look at for a toddler. */
    return '<span class="pic ' + (word.mo ? 'mo-' + U.esc(word.mo) : 'mo-still') + ' ' + (cls || '') + '">' + sym + inner + '</span>';
  }

  /* ------------------------------------------------------------------ cards */

  /**
   * The flash card. opts:
   *   size      'big' (one at a time) | 'tile'
   *   flip      show Tamil side only after a tap
   *   speak     speak on tap (default true)
   *   onTap     extra tap handler
   *   showSay   show the grown-up phrase chip
   */
  function cardEl(word, opts) {
    opts = opts || {};
    var s = TT.store.settings;
    var mode = opts.mode || s.mode || 'bilingual';
    var flip = opts.flip != null ? opts.flip : (s.reveal === 'flip' && opts.size === 'big');

    var words = document.createElement('div');
    words.className = 'card-words';
    if (mode !== 'english') {
      U.append(words, U.el('div.w-ta.tamil', { text: word.ta }));
      if (s.showRoman !== false) U.append(words, U.el('div.w-ro', { text: word.ro }));
    }
    if (mode !== 'tamil') U.append(words, U.el('div.w-en', { text: word.en }));
    if (opts.showSay !== false && s.showSay !== false && word.say && opts.size === 'big') {
      var say = U.el('button.chip.chip-say', { type: 'button', title: 'Hear the grown-up sentence' }, [
        U.el('span.chip-ico', { text: '💬' }), U.el('span.tamil', { text: word.say })
      ]);
      say.addEventListener('click', function (e) {
        e.stopPropagation();
        A.unlock(); A.cancel(); A.speakSentence(word);
        A.sfx('ding');
      });
      U.append(words, say);
    }

    var front = U.el('div.face.front', {}, [U.el('div.card-stage', {}, U.el('div.card-pic', { html: pictureHTML(word) }))]);
    var card;

    if (flip) {
      var back = U.el('div.face.back', {}, [
        U.el('div.card-stage', {}, [
          U.el('div.flip-words', {}, [
            mode !== 'english' ? U.el('div.w-ta.tamil.big-ta', { text: word.ta }) : null,
            s.showRoman !== false && mode !== 'english' ? U.el('div.w-ro', { text: word.ro }) : null,
            mode !== 'tamil' ? U.el('div.w-en' + (mode === 'english' ? ' tamil big-ta' : ''), { text: word.en }) : null
          ])
        ])
      ]);
      card = U.el('article.card.card-flip' + (opts.size === 'big' ? ' card-big' : ' card-tile'), {
        dataset: { id: word.id, cat: word.cat, side: 'front' }, tabindex: '0', role: 'button',
        'aria-label': word.en + ' — ' + word.ta
      }, [front, back]);
    } else {
      var body = U.el('div.card-body', {}, [
        U.el('div.card-stage', {}, U.el('div.card-pic', { html: pictureHTML(word) })),
        words
      ]);
      card = U.el('article.card' + (opts.size === 'big' ? ' card-big' : ' card-tile'), {
        dataset: { id: word.id, cat: word.cat }, tabindex: '0', role: 'button',
        'aria-label': word.en + ' — ' + word.ta
      }, body);
    }

    var lvl = TT.store.level(word.id);
    if (lvl > 0) U.append(card, U.el('span.level-dot', { dataset: { lvl: String(lvl) }, title: TT.store.LEVELS[lvl].en }));

    function tap(e) {
      if (e) e.preventDefault();
      A.unlock();
      TT.store.markSeen(word.id);
      if (flip) {
        var now = card.dataset.side === 'front' ? 'back' : 'front';
        card.dataset.side = now;
        A.sfx('flip');
      }
      if (opts.speak !== false) {
        A.cancel();
        A.sayWord(word, { onend: function () { if (opts.onEnd) opts.onEnd(); } });
      }
      if (opts.speak !== false) A.sfx(word.cat === 'animals' || word.cat === 'birds' || word.cat === 'bugs' || word.cat === 'sea' ? 'animal' : 'pop');
      U.haptic(14);
      card.classList.remove('tapped');
      void card.offsetWidth;
      card.classList.add('tapped');
      if (opts.onTap) opts.onTap(word, card);
    }
    card.addEventListener('click', tap);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(e); }
    });
    return card;
  }

  /** Small square button that speaks a word — used in the sticker book & grids. */
  function miniCard(word, onClick) {
    var m = TT.store.settings.mode;
    var node = U.el('button.mini', { type: 'button', dataset: { id: word.id }, 'aria-label': word.en }, [
      U.el('span.mini-pic', { html: pictureHTML(word) }),
      m !== 'english' ? U.el('span.mini-ta.tamil', { text: word.ta }) : null,
      m !== 'tamil' ? U.el('span.mini-en', { text: word.en }) : null
    ]);
    node.addEventListener('click', function () {
      A.unlock(); A.cancel(); A.sfx('pop'); A.sayWord(word);
      TT.store.markSeen(word.id);
      U.haptic(10);
      if (onClick) onClick(word, node);
    });
    return node;
  }

  /* ------------------------------------------------------------------ tiles */

  function catTile(cat, href, opts) {
    opts = opts || {};
    var total = cat.words.length;
    var seen = 0;
    cat.words.forEach(function (w) { if (TT.store.level(w.id) > 0) seen++; });
    var pct = total ? Math.round((seen / total) * 100) : 0;
    var node = U.el('a.tile', {
      href: href, dataset: { cat: cat.key },
      style: '--cat:' + cat.color + ';--cat2:' + (cat.color2 || shade(cat.color, 18)),
      'aria-label': cat.en + ' ' + cat.ta
    }, [
      U.el('span.tile-icon', { text: cat.icon }),
      U.el('span.tile-ta.tamil', { text: cat.ta }),
      U.el('span.tile-en', { text: cat.en }),
      U.el('span.tile-count', { text: total + ' words' }),
      U.el('span.tile-bar', {}, U.el('span.tile-bar-fill', { style: 'width:' + pct + '%' }))
    ]);
    node.addEventListener('click', function () { A.unlock(); A.sfx('tap'); });
    return node;
  }

  function shade(hex, amt) {
    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    if (!m) return hex;
    var r = Math.min(255, parseInt(m[1], 16) + amt), g = Math.min(255, parseInt(m[2], 16) + amt), b = Math.min(255, parseInt(m[3], 16) + amt);
    return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  }

  /* ----------------------------------------------------------------- chrome */

  function bigButton(label, opts, onclick) {
    opts = opts || {};
    var b = U.el('button.big-btn', {
      type: 'button',
      style: opts.color ? '--cat:' + opts.color : null,
      'aria-label': opts.aria || label
    }, [
      opts.icon ? U.el('span.big-btn-ico', { text: opts.icon }) : null,
      U.el('span.big-btn-label', {}, [
        U.el('span', { text: label }),
        opts.ta ? U.el('span.tamil.big-btn-ta', { text: opts.ta }) : null
      ]),
      opts.sub ? U.el('span.big-btn-sub', { text: opts.sub }) : null
    ]);
    b.addEventListener('click', function () { A.unlock(); A.sfx('tap'); onclick && onclick(); });
    return b;
  }

  var scrimCount = 0;
  function sheet(title, contentNode, opts) {
    opts = opts || {};
    var root = document.getElementById('sheet-root');
    var scrim = U.el('div.scrim');
    var box = U.el('div.sheet', { role: 'dialog', 'aria-modal': 'true', 'aria-label': title, tabindex: '-1' });
    var head = U.el('header.sheet-head', {}, [
      U.el('h2.sheet-title', { text: title }),
      U.el('button.icon-btn.sheet-close', { type: 'button', 'aria-label': 'Close', text: '✕' })
    ]);
    head.querySelector('.sheet-close').addEventListener('click', close);
    U.append(box, [head, U.el('div.sheet-body', {}, contentNode)]);
    if (opts.footer) U.append(box, U.el('footer.sheet-foot', {}, opts.footer));
    U.append(root, [scrim, box]);
    requestAnimationFrame(function () { scrim.classList.add('in'); box.classList.add('in'); });
    scrimCount++;
    document.body.classList.add('sheet-open');
    head.querySelector('.sheet-close').focus();

    function close() {
      if (!scrim.parentNode) return;
      scrim.classList.remove('in'); box.classList.remove('in');
      setTimeout(function () {
        if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
        if (box.parentNode) box.parentNode.removeChild(box);
      }, 180);
      scrimCount--;
      if (scrimCount <= 0) document.body.classList.remove('sheet-open');
      if (opts.onClose) opts.onClose();
    }
    scrim.addEventListener('click', close);
    box.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    return { close: close, node: box };
  }

  var toastTimer;
  function toast(msg, opts) {
    opts = opts || {};
    var t = document.getElementById('toast');
    if (!t) { t = U.el('div#toast.toast', { role: 'status', 'aria-live': 'polite' }); document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('in');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('in'); }, opts.ms || 1800);
  }

  function sectionHead(ta, en, extra) {
    return U.el('div.section-head', {}, [
      U.el('h2.section-ta.tamil', { text: ta }),
      U.el('p.section-en', { text: en }),
      extra || null
    ]);
  }

  function empty(msg) { return U.el('p.empty', { text: msg || 'Nothing here yet — play a little!' }); }

  TT.ui = {
    pictureHTML: pictureHTML,
    cardEl: cardEl,
    miniCard: miniCard,
    catTile: catTile,
    bigButton: bigButton,
    sheet: sheet,
    toast: toast,
    sectionHead: sectionHead,
    empty: empty,
    shade: shade
  };
})(window.TT = window.TT || {});
